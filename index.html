<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FDF8F2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>存錢小豬記帳本</title>
<style>
:root{
  --bg:#FDF8F2; --paper:#FFFFFF; --sand:#F1E6D8; --sand2:#E6D6C2; --line:#EFE3D3;
  --cocoa:#5A4434; --dim:#9C8A79; --caramel:#C79C72; --honey:#E9C77B;
  --out:#CF7F74; --in:#7FA97A; --move:#8497BD; --pink:#F3D9CC;
  --blob:24px 20px 26px 22px / 22px 26px 20px 24px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overscroll-behavior:none}
button,select,input,label,a{touch-action:manipulation}
body{background:var(--bg);color:var(--cocoa);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px dashed var(--caramel);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{padding:14px 16px 4px;display:flex;align-items:center;gap:6px}
header h1{margin:0;font-size:21px;font-weight:800;flex:1}
.month{display:flex;align-items:center;color:var(--dim)}
.month button{background:none;border:0;padding:6px 9px;font-size:20px;color:var(--caramel)}
.month span{min-width:88px;text-align:center;color:var(--cocoa);font-weight:600;font-size:14.5px}
.gear{background:var(--paper);border:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 0 var(--sand2);color:var(--caramel)}
.gear svg{width:20px;height:20px}
main{flex:1;overflow-y:auto;padding:4px 16px 120px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.view{display:none}.view.on{display:block}
.c-out{color:var(--out)}.c-in{color:var(--in)}.c-move{color:var(--move)}

/* 卡片 */
.card{background:var(--paper);border-radius:var(--blob);padding:16px;margin-bottom:14px;box-shadow:0 3px 0 var(--sand)}
.card h2{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--caramel);padding:2px;font-size:14px;font-weight:600}

/* 總覽 */
.hero{padding:6px 0 12px;text-align:center}.hero:empty{display:none}
.hero img{width:72%;max-width:250px;height:auto;display:block;margin:0 auto}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.empty img{width:170px;height:auto;display:block;margin:0 auto}
.big{font-size:36px;font-weight:800;line-height:1.1}
.sub{color:var(--dim);font-size:13.5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px}.kv span{color:var(--dim);flex:1 0 4.5em}.kv b{text-align:right;font-weight:600}
.subrow{display:flex;gap:16px;color:var(--dim);font-size:14px;margin-top:6px}
.subrow b{font-weight:700}
.bar{height:12px;background:var(--sand);border-radius:8px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s;
  background:repeating-linear-gradient(-45deg,var(--caramel) 0 8px,#D3AE87 8px 16px)}
.bar i.over{background:var(--out)}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}

.bill{border:0;width:100%;text-align:left;background:var(--sand);border-radius:18px;padding:12px 14px;margin-top:8px;display:block}
.bill .top{display:flex;justify-content:space-between;align-items:baseline}
.bill .top b{font-size:15.5px}
.bill .amt{font-size:22px;font-weight:800}
.bill .meta{font-size:12.5px;color:var(--dim)}
.bill .two-col{display:flex;justify-content:space-between;margin-top:6px;gap:10px}

.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.li:first-child{border-top:0}
.li .nm{flex:1;min-width:0}
.li .nm small{display:block;color:var(--dim);font-size:12.5px}
.li.btn-li{background:none;border:0;border-top:1px dashed var(--line);width:100%;text-align:left}
.li.btn-li:first-child{border-top:0}
.mini{height:6px;background:var(--sand);border-radius:4px;margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--honey);border-radius:4px}
.jar-ico{font-size:26px;width:44px;height:44px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.jar-row{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:10px 0;text-align:left;font:inherit;color:inherit;border-bottom:1px dashed var(--line);cursor:pointer}
.jar-row:last-child{border-bottom:0}
.jar-big{position:relative;width:150px;height:150px;margin:6px auto 8px}
.jar-big svg{width:100%;height:100%}
.jar-big .e{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;padding-top:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{border:0;border-radius:999px;background:var(--bg);padding:8px 14px;font:inherit;font-size:14px;color:inherit}
.chips button.on{background:var(--caramel);color:#fff}

/* 明細 */
.day{margin-bottom:14px}
.day h3{margin:0 0 6px 4px;font-size:13px;font-weight:600;color:var(--dim);display:flex;justify-content:space-between}
.daybox{background:var(--paper);border-radius:var(--blob);box-shadow:0 3px 0 var(--sand);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:11px 13px;background:none;border:0;width:100%;text-align:left}
.tx+.tx{border-top:1px dashed var(--line)}
.dot{width:38px;height:38px;border-radius:14px 16px 13px 15px;display:grid;place-items:center;font-size:15px;font-weight:800;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .meta{font-size:12.5px;color:var(--dim)}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;background:var(--sand);color:var(--caramel);margin-left:4px;font-weight:600;vertical-align:1px}
.tag.pend{background:#F0E6F0;color:#9A7BA0}
.tag.late{background:#F8DEDA;color:#C0574B}
.tag.ok{background:#E3EFE0;color:#5E8F58}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#2a211b;aspect-ratio:1/1;max-height:52vh;margin:6px auto 10px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .fr{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.chooselist{display:flex;flex-direction:column;gap:8px}
.chooselist .btn{flex:none;width:100%}
.lsearch{display:flex;gap:8px;margin:0 0 12px}
.lsearch input{flex:1;min-width:0;border:0;border-radius:14px;background:var(--paper);padding:11px 14px;font:inherit;box-shadow:0 2px 0 var(--sand)}
.lsearch button{flex:none;border:0;border-radius:14px;background:var(--paper);padding:0 12px;font:inherit;font-size:13.5px;font-weight:700;color:var(--caramel);box-shadow:0 2px 0 var(--sand)}
.hl{background:#F6E2A8;border-radius:3px}
.ptxt{width:100%;min-height:110px;border:0;border-radius:14px;background:var(--bg);padding:12px;font:inherit;font-size:14px;color:inherit;resize:vertical;box-sizing:border-box}
.prow{border-bottom:1px dashed var(--line);padding:10px 0}.prow:last-child{border-bottom:0}
.prow .top{display:flex;gap:10px;align-items:flex-start}
.prow .ed{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 0 32px}
.prow .ed input,.prow .ed select{border:0;background:var(--bg);border-radius:10px;padding:7px 9px;font:inherit;font-size:13.5px;color:inherit;min-width:0}
.prow .src{font-size:11.5px;color:var(--dim);margin:4px 0 0 32px;white-space:pre-wrap;word-break:break-all;opacity:.8}
.ck{width:22px;height:22px;accent-color:var(--in);flex:none}
.sbtn{border:0;background:var(--sand);color:var(--cocoa);border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:600}
.stmt{background:var(--bg);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.stmt .acts{margin-top:10px}
.stmt .f input,.stmt .f select{background:var(--paper)}
.stmt .btn{padding:9px;font-size:14px}
.tx .amt{font-weight:700;font-size:16px}
.tx.future{opacity:.7}
.empty{text-align:center;color:var(--dim);padding:24px 20px 30px}
.empty b{display:block;color:var(--cocoa);font-size:16px;margin:6px 0 2px}

/* 統計 */
.donut-wrap{display:flex;justify-content:center;margin:4px 0 12px}
.sw{width:11px;height:11px;border-radius:4px;flex:none}
.pc{color:var(--dim);font-size:13px;width:50px;text-align:right}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;border:0;background:var(--paper);box-shadow:0 2px 0 var(--sand);border-radius:16px;padding:5px 13px;font-size:13.5px;color:var(--dim)}
.chip.on{background:var(--caramel);color:#fff;box-shadow:0 2px 0 #A98159;font-weight:600}

/* 帳戶 */
.acct{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--paper);border-radius:var(--blob);box-shadow:0 3px 0 var(--sand);margin-bottom:10px;width:100%;border:0;text-align:left}
.acct .mid{flex:1}
.acct .meta{font-size:12.5px;color:var(--dim)}
.acct .amt{font-weight:700;font-size:16px}
.section-t{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px}
.section-t h2{margin:0;font-size:15px;color:var(--dim);font-weight:700}

/* 設定 */
.group{background:var(--paper);border-radius:var(--blob);box-shadow:0 3px 0 var(--sand);margin-bottom:16px;overflow:hidden}
.set{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:none;border:0;width:100%;text-align:left}
.set+.set{border-top:1px dashed var(--line)}
.set .v{color:var(--dim)}
.set.danger{color:var(--out)}
.note{color:var(--dim);font-size:13px;padding:0 6px;margin:-6px 0 16px}

/* 導覽 */
nav{position:fixed;left:0;right:0;bottom:0;background:#FFFBF5;transform:translateZ(0);
  border-radius:24px 24px 0 0;box-shadow:0 -2px 0 var(--sand);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr}
nav button.t{background:none;border:0;padding:10px 0 12px;color:var(--dim);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
nav button.t svg{width:23px;height:23px}
nav button.t.on{color:var(--cocoa)}
nav button.t.on svg{color:var(--caramel)}
.fab{justify-self:center;align-self:start;margin-top:-24px;width:62px;height:62px;border-radius:26px 30px 27px 29px;border:4px solid var(--bg);
  background:var(--caramel);color:#fff;font-size:34px;line-height:1;box-shadow:0 4px 0 #A98159}
.fab:active{transform:translateY(2px);box-shadow:0 2px 0 #A98159}

/* 表單 */
.mask{position:fixed;inset:0;background:rgba(90,68,52,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--paper);border-radius:28px 28px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  z-index:11;max-height:92%;overflow-y:auto;overscroll-behavior:contain;will-change:transform}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grip{cursor:grab;touch-action:none;position:relative}.grip::before{content:'';position:absolute;inset:-14px -80px}
.fold-h{cursor:pointer;user-select:none}
.fold-h .ttl{display:inline-flex;align-items:center}.fold-h .chev{display:inline-block;margin-left:6px;font-size:12px;color:var(--dim);transition:transform .2s}
.card.folded .chev{transform:rotate(-90deg)}
.card.folded .fbody{display:none}
.card .fsum{display:none;font-size:13.5px;color:var(--dim);margin-top:-6px}
.card.folded .fsum{display:block}
.sgrp{font-size:13px;font-weight:800;color:var(--dim);margin:16px 6px 6px;letter-spacing:.5px}
.sgrp:first-of-type{margin-top:4px}
.dchips{display:flex;gap:6px;margin:-4px 0 12px}
.dchips button{border:0;border-radius:999px;background:var(--bg);padding:6px 12px;font:inherit;font-size:13px;color:var(--cocoa)}
.dchips button.on{background:var(--caramel);color:#fff}
.viewseg{margin-bottom:12px}
.grip{width:42px;height:5px;border-radius:3px;background:var(--sand2);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:18px;font-weight:800}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sand);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:8px 0;border-radius:12px;color:var(--dim);font-weight:600}
.seg button.on{background:var(--paper);color:var(--cocoa);box-shadow:0 2px 0 var(--sand2)}
.seg button.on[data-t=out]{background:var(--out);color:#fff;box-shadow:none}
.seg button.on[data-t=in]{background:var(--in);color:#fff;box-shadow:none}
.seg button.on[data-t=move]{background:var(--move);color:#fff;box-shadow:none}
.amount-in{display:flex;align-items:baseline;gap:6px;border-bottom:2px dashed var(--sand2);padding:4px 2px 8px;margin-bottom:6px}
.amount-in span{font-size:22px;color:var(--dim)}
.amount-in input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.amount-in:focus-within{border-color:var(--caramel)}
.hint{font-size:12.5px;color:var(--dim);margin:0 2px 12px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px;font-weight:600}
.f input,.f select{width:100%;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:9px 12px;outline:0}
.f input:focus,.f select:focus{border-color:var(--caramel)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{border:0;background:var(--bg);border-radius:14px;padding:8px 2px;font-size:13.5px;color:var(--dim)}
.cats button.on{background:var(--honey);color:var(--cocoa);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px;margin:10px 0 12px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--caramel)}
.banner{background:#F6ECDA;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:16px;padding:13px;font-weight:700;font-size:16px;background:var(--caramel);color:#fff;box-shadow:0 3px 0 #A98159}
.btn.ghost{background:var(--sand);color:var(--cocoa);flex:0 0 auto;padding:13px 18px;box-shadow:0 3px 0 var(--sand2)}
.btn.del{background:none;color:var(--out);flex:0 0 auto;padding:13px 8px;box-shadow:none}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:9px 12px;outline:0}
.addrow button{border:0;border-radius:14px;background:var(--caramel);color:#fff;padding:0 16px;font-weight:700}
.x{background:none;border:0;color:var(--out);padding:4px 8px}
.total-box{text-align:center;background:var(--bg);border-radius:var(--blob);padding:14px;margin:4px 0 12px}
.brk .li{font-size:14px}

.toast{position:fixed;left:50%;bottom:118px;transform:translate(-50%,20px);background:var(--cocoa);color:var(--paper);padding:9px 18px;border-radius:20px;
  font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.askbg{position:fixed;inset:0;z-index:9999;background:rgba(60,40,25,.35);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .15s}
.askbg.on{opacity:1}
.askbox{background:var(--paper);border-radius:22px;padding:22px 20px 16px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.askmsg{white-space:pre-line;line-height:1.6;margin-bottom:16px;font-size:15px}
.askbox .acts{display:flex;gap:10px}.askbox .btn{flex:1}
.askbox .btn.warn{background:var(--out);box-shadow:none;color:#fff}
.c-warn{color:#C48A2C}
#sheet .li select{border:0;background:var(--bg);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;color:inherit}
.mv{border:0;background:var(--sand);color:var(--cocoa);border-radius:10px;padding:5px 10px;font-size:13px;margin-left:6px;font-weight:700}
.mv:disabled{opacity:.3}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">總覽</h1>
    <div class="month" id="monthBox">
      <button aria-label="上個月" onclick="shiftMonth(-1)">‹</button>
      <span id="monthLbl" class="num"></span>
      <button aria-label="下個月" onclick="shiftMonth(1)">›</button>
    </div>
    <button class="gear" aria-label="設定" onclick="go('set')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg></button>
  </header>
  <main>
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-list"></section>
    <section class="view" id="v-stats"></section>
    <section class="view" id="v-accts"></section>
    <section class="view" id="v-set"></section>
    <section class="view" id="v-pay"></section>
  </main>
</div>

<nav><div class="in">
  <button class="t on" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>總覽</button>
  <button class="t" data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6.5h14M5 12h14M5 17.5h9"/></svg>明細</button>
  <button class="fab" aria-label="記一筆" onclick="openTx()">+</button>
  <button class="t" data-v="accts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M15.5 15h2.5"/></svg>帳戶</button>
  <button class="t" data-v="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="3"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7M3 12.5h18"/></svg>薪資</button>
</div></nav>

<div class="mask" id="mask" onclick="sheetBack()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>
<input type="file" id="invImg" accept="image/*" capture="environment" hidden><input type="file" id="invCsv" accept=".csv,.txt,.xlsx,.xls,text/csv,text/plain" hidden>
<input type="file" id="xlsIn" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>

<script>
/* ================= 小豬吉祥物（原創） ================= */
function pig(w=96, coin=false){

const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const mlen=(y,m)=>new Date(y,m+1,0).getDate();
function mkDate(y,m,day){const d=new Date(y,m,1);return new Date(d.getFullYear(),d.getMonth(),Math.min(day,mlen(d.getFullYear(),d.getMonth())))}

function balance(a){
  const td=today();let b=+a.init||0;
  for(const t of db.txs){
    if(t.date>td)continue;
    if(t.type==='out'&&t.accountId===a.id)b-=t.amount;
    if(t.type==='in'&&t.accountId===a.id)b+=t.amount;
    if(t.type==='move'){if(t.accountId===a.id)b-=t.amount;if(t.toAccountId===a.id)b+=t.amount}
  }
  return b;
}

/* 下一個要繳款的日期（今天以後最近的一次） */
function nextDue(c){
  if(!c.stmtDay||!c.dueDay)return null;
  const td=today(),t=new Date();
  for(let k=-2;k<=1;k++){const d=cycle(c,t.getFullYear(),t.getMonth()+k).due;if(d&&d>=td)return d}
  return null;
}
/* 信用卡額度：已用＝目前欠款＋分期未入帳的部分（銀行會把分期剩餘本金整筆佔用額度） */
function cardUse(c,extra=0){
  const limit=+c.limit||0;let b=+c.init||0;
  for(const t of db.txs){
    if(t.type==='out'&&t.accountId===c.id)b-=t.amount;
    if(t.type==='in'&&t.accountId===c.id)b+=t.amount;
    if(t.type==='move'){if(t.accountId===c.id)b-=t.amount;if(t.toAccountId===c.id)b+=t.amount}
  }
  const used=Math.max(0,-b)+extra;
  return {limit,used,bal:b,avail:limit-used,pct:limit?Math.min(100,used/limit*100):0};
}
function limitBar(c){
  const U=cardUse(c);if(!U.limit)return '';
  const col=U.avail<0?'var(--out)':U.pct>=80?'var(--honey)':'var(--caramel)';
  return `<div class="mini" style="margin:8px 0 4px"><i style="width:${U.pct}%;background:${col}"></i></div>
    <div class="sub" style="display:flex;justify-content:space-between"><span>已用 ${money(U.used)}／額度 ${money(U.limit)}</span><b class="${U.avail<0?'c-out':''}">${U.avail<0?'超過 '+money(-U.avail):'可用 '+money(U.avail)}</b></div>`;
}

/* ================= 週期性付款 ================= */
function occurrences(r,from,to){
  if(!r.start)return[];
  const lo=from>r.start?from:r.start;
  const hi=r.end&&r.end<to?r.end:to;
  if(lo>hi)return[];
  const out=[];
  if(r.freq==='weekly'){
    let d=pd(r.start);
    const gap=Math.max(0,Math.floor((pd(lo)-d)/864e5/7));
    d.setDate(d.getDate()+gap*7);
    while(ds(d)<lo)d.setDate(d.getDate()+7);
    while(ds(d)<=hi){out.push(ds(d));d.setDate(d.getDate()+7)}
  }else if(r.freq==='yearly'){
    const s=pd(r.start);
    for(let y=pd(lo).getFullYear();y<=pd(hi).getFullYear();y++){
      const x=ds(mkDate(y,s.getMonth(),s.getDate()));if(x>=lo&&x<=hi)out.push(x);
    }
  }else{
    const a=pd(lo),b=pd(hi);
    for(let y=a.getFullYear(),m=a.getMonth();y<b.getFullYear()||(y===b.getFullYear()&&m<=b.getMonth());m++,(m>11&&(m=0,y++))){
      const x=ds(mkDate(y,m,+r.day||1));if(x>=lo&&x<=hi)out.push(x);
    }
  }
  return out;
}
function recTx(r,date){
  return {id:uid(),ts:Date.now(),type:r.type,amount:r.amount,accountId:r.accountId,toAccountId:'',
    category:r.category,projectId:r.projectId||'',date,note:r.name,recId:r.id,recFor:date};
}
/* 國外交易手續費：照週期性付款設定的 %，另外記一筆（銀行帳單上也是分開的一行） */
function recFeeSync(r,t){
  const old=db.txs.find(x=>x.recFee&&x.recId===r.id&&x.recFor===(t.recFor||t.date));
  const pct=+r.feePct||0;
  if(!(pct>0)||r.type!=='out'){if(old)db.txs=db.txs.filter(x=>x!==old);return}
  if(!db.categories.out.includes('手續費'))db.categories.out.push('手續費');
  const amt=Math.round(t.amount*pct/100);
  if(old)Object.assign(old,{amount:amt,date:t.date,accountId:t.accountId});
  else if(amt>0)db.txs.push({id:uid(),ts:Date.now()+1,type:'out',amount:amt,accountId:t.accountId,toAccountId:'',category:'手續費',projectId:r.projectId||'',date:t.date,note:`${r.name} 國外交易手續費`,recId:r.id,recFee:1,recFor:t.recFor||t.date});
}
function postRecurring(){
  const td=today();let n=0;
  for(const r of db.recurring){
    if(!r.start||r.start>td)continue;
    const from=r.posted?addDays(r.posted,1):r.start;
    for(const d of occurrences(r,from,td)){if(db.txs.some(t=>t.recId===r.id&&!t.recFee&&(t.recFor||t.date)===d))continue;const t=recTx(r,d);db.txs.push(t);recFeeSync(r,t);n++}
    r.posted=td;
  }
  if(n)save();
  return n;
}
const nextOcc=r=>occurrences(r,addDays(today(),1),addDays(today(),400))[0];

/* ================= 信用卡帳單週期 ================= */
function cycle(card,y,m){
  const S=+card.stmtDay||31;
  const end=mkDate(y,m,S), prevEnd=mkDate(y,m-1,S);
  if(card.stmtExcl){end.setDate(end.getDate()-1);prevEnd.setDate(prevEnd.getDate()-1)}
  const start=new Date(prevEnd);start.setDate(start.getDate()+1);
  let due=null;
  if(card.dueDay){const D=+card.dueDay;due=ds(mkDate(y,dueSame(card)?m:m+1,D))}
  const d=new Date(y,m,1);
  return {start:ds(start),end:ds(end),due,y:d.getFullYear(),m:d.getMonth()};
}
const dueSame=c=>c.dueMonth==='same'||(c.dueMonth!=='next'&&+c.dueDay>(+c.stmtDay||31));
function duePreview(c){
  if(!c.stmtDay||!c.dueDay)return '';
  const t=new Date(),cy=cycle(c,t.getFullYear(),t.getMonth());
  return `例：${md(cy.end)} 結帳（${md(cy.start)}–${md(cy.end)} 的消費），最晚 ${md(cy.due)} 繳款`;
}
/* ===== 信用卡帳本：已結帳帳單 + 分次繳款（先繳舊帳） ===== */
const skey=(c,end)=>c.id+'|'+end;
function closedCycles(c){
  const oc=openCycle(c);let first=null;
  for(const t of db.txs){if(t.accountId!==c.id||t.type==='move'&&t.toAccountId===c.id)continue;
    const e=t.postDate||t.date;if(!first||e<first)first=e}
  if(!first||first>=oc.start)return[];
  const f=pd(first);let y=f.getFullYear(),m=f.getMonth();
  if(first>cycle(c,y,m).end)m++;
  const out=[];
  for(let i=0;i<240;i++){const cy=cycle(c,y,m+i);if(cy.end>=oc.start)break;out.push(cy)}
  return out;
}
function cardLedger(c){
  const td=today(),stmts=[];
  if((+c.init||0)<0)stmts.push({opening:true,start:'',end:'',due:null,calc:-c.init,amount:-c.init});
  for(const cy of closedCycles(c)){
    const calc=payable(c,cy.start,cy.end).total,st=db.stmts[skey(c,cy.end)]||{};
    const bank=st.bank!=null&&st.bank!==''?+st.bank:null;
    stmts.push({...cy,calc,bank,reconciled:!!st.reconciled,amount:bank!=null?bank:calc});
  }
  let pool=db.txs.filter(t=>t.type==='move'&&t.toAccountId===c.id&&t.date<=td).reduce((s,t)=>s+t.amount,0);
  pool+=stmts.filter(x=>x.amount<0).reduce((s,x)=>s-x.amount,0);
  for(const x of stmts){
    const need=Math.max(0,x.amount),use=Math.min(pool,need);pool-=use;
    x.paid=use;x.remain=need-use;
    x.status=x.remain<=0?(need>0?'已繳清':'無須繳款'):x.due&&x.due<td?'已逾期':use>0?'部分繳款':'未繳';
  }
  const oc=openCycle(c),ost=db.stmts[skey(c,oc.end)]||{};
  const open={...oc,calc:payable(c,oc.start,oc.end).total,reconciled:!!ost.reconciled};
  return {c,stmts,open,credit:pool,unpaid:stmts.reduce((s,x)=>s+x.remain,0),
    target:stmts.find(x=>x.remain>0)};
}
const stTag=st=>`<span class="tag ${st==='已逾期'?'late':st==='已繳清'||st==='無須繳款'?'ok':''}">${st}</span>`;
function openCycle(card){
  const t=new Date();let y=t.getFullYear(),m=t.getMonth();
  if(ds(t)>cycle(card,y,m).end)m++;
  return cycle(card,y,m);
}
function payable(card,from,to){
  const td=today(),items=[];let paid=0;
  for(const t of db.txs){
    if(t.type==='move'&&t.toAccountId===card.id){if(t.date>=from&&t.date<=to)paid+=t.amount;continue}
    if(t.accountId!==card.id)continue;
    const eff=t.postDate||t.date;
    if(eff<from||eff>to)continue;
    const kind=t.instId?'inst':t.recId?'rec':t.type==='in'?'refund':'normal';
    const sign=t.type==='in'?-1:1;
    items.push({id:t.id,date:eff,orig:t.date,name:t.type==='move'?'轉出／預借':(t.note||t.category),amount:sign*t.amount,kind,pending:eff>td,
      checked:!!t.checked,deferred:!!t.postDate&&t.postDate!==t.date,label:t.instId?`分期 ${t.instNo}/${t.instN}`:''});
  }
  const pStart=addDays(td,1)>from?addDays(td,1):from;
  for(const r of db.recurring){
    if(r.accountId!==card.id)continue;
    for(const d of occurrences(r,pStart,to))
      items.push({date:d,name:r.name,amount:(r.type==='in'?-1:1)*r.amount,kind:'recF',pending:true});
  }
  items.sort((a,b)=>a.date.localeCompare(b.date));
  const sum=k=>items.filter(i=>k.includes(i.kind)).reduce((s,i)=>s+i.amount,0);
  return {items,paid,total:items.reduce((s,i)=>s+i.amount,0),
    normal:sum(['normal']),inst:sum(['inst']),rec:sum(['rec']),recF:sum(['recF']),refund:sum(['refund'])};
}

let imp=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc)});
}
const CAT_SYN={'吃喝':'餐飲','飲食':'餐飲','食物':'餐飲','美食':'餐飲','餐費':'餐飲','住房':'居家','居住':'居家','生活':'居家','日用':'居家','休閒':'娛樂','玩樂':'娛樂','醫藥':'醫療','健康':'醫療','工資':'薪資','薪水':'薪資','年終':'獎金','理財':'投資'};
function impDate(v){
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));
    return {date:`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`,key:v.toFixed(6)}}
  const m=String(v||'').trim().match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  return m?{date:`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`,key:String(v).trim()}:null;
}
function impCatGuess(name,kind){
  const list=db.categories[kind];if(!name)return list.includes('其他')?'其他':list[0];
  if(list.includes(name))return name;
  const syn=CAT_SYN[name];if(syn&&list.includes(syn))return syn;
  const hit=list.find(c=>c.includes(name)||name.includes(c));return hit||'＋'+name;
}
function impAcctGuess(name){
  const a=db.accounts.find(x=>x.name===name)||db.accounts.find(x=>x.type!=='loan'&&(x.name.includes(name)||name.includes(x.name)));
  return a?a.id:'new:'+(name==='現金'?'cash':/pay|街口|支付|悠遊|一卡通/i.test(name)?'epay':'credit');
}
async function readImportFile(f){
  try{toast('讀取中…');await loadXLSX()}catch(e){return toast('需要網路才能讀 Excel，請連上網路再試')}
  let rows;
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
  catch(e){return toast('這個檔案讀不出來，請確認是 Excel 或 CSV')}
  const hi=rows.findIndex(r=>r.some(c=>/金額/.test(c))&&r.some(c=>/類型|收支|時間|日期/.test(c)));
  if(hi<0)return toast('找不到「金額」「日期」等欄位，這個格式還不支援');
  const H=rows[hi].map(c=>String(c).trim()),col=re=>H.findIndex(h=>re.test(h));
  const C={type:col(/類型|收支/),time:col(/時間|日期/),acct:col(/帳戶/),amt:col(/金額/),c1:col(/一級分類|^分類$|類別|主分類/),c2:col(/二級分類|子分類|次分類/),note:col(/備註|說明|描述|項目/),fee:col(/手續費/)};
  if(C.time<0||C.amt<0)return toast('缺少日期或金額欄位');
  const items=[];
  for(const r of rows.slice(hi+1)){
    const raw=parseFloat(String(r[C.amt]).replace(/[^\d.\-]/g,''));if(!raw)continue;
    const d=impDate(r[C.time]);if(!d)continue;
    const tp=C.type>=0?String(r[C.type]):'';
    const kind=/收入/.test(tp)?'in':/支出/.test(tp)?'out':raw>0?'in':'out';
    const fee=C.fee>=0?Math.abs(parseFloat(r[C.fee])||0):0;
    items.push({kind,date:d.date,tkey:d.key,acct:C.acct>=0?String(r[C.acct]).trim()||'現金':'現金',amount:Math.abs(raw)+fee,
      c1:C.c1>=0?String(r[C.c1]).trim():'',c2:C.c2>=0?String(r[C.c2]).trim():'',note:C.note>=0?String(r[C.note]).trim():''});
  }
  if(!items.length)return toast('檔案裡沒有可以匯入的紀錄');
  /* 還款／轉帳：同一時間、同金額，一筆支出一筆收入 → 轉帳 */
  const used=new Set(),pairs=[];
  items.forEach((a,i)=>{if(used.has(i)||a.kind!=='out'||!/還款|轉帳|轉賬|繳卡費|信用卡繳款/.test(a.c1+a.c2))return;
    const j=items.findIndex((b,k)=>!used.has(k)&&k!==i&&b.kind==='in'&&b.tkey===a.tkey&&b.amount===a.amount&&b.acct!==a.acct);
    if(j>=0){used.add(i);used.add(j);pairs.push({from:a.acct,to:items[j].acct,amount:a.amount,date:a.date,tkey:a.tkey,note:a.note||items[j].note||(a.c1||'還款')})}});
  let singles=items.filter((_,i)=>!used.has(i));
  const groups=findInstGroups(singles.filter(x=>x.kind==='out'));
  const inG=new Set(groups.flatMap(g=>[g.total,...g.parts]));
  singles=singles.filter(x=>!inG.has(x));
  const accts=[...new Set(items.map(x=>x.acct))],cats={out:{},in:{}};
  for(const x of singles)cats[x.kind][x.c1||'其他']=impCatGuess(x.c1,x.kind);
  imp={singles,pairs,groups:groups.map(g=>({...g,on:true})),accts:Object.fromEntries(accts.map(a=>[a,impAcctGuess(a)])),cats,sub:true,
    range:[items.map(x=>x.date).sort()[0],items.map(x=>x.date).sort().pop()]};
  drawImport();
}
/* 分期辨識：同帳戶、同備註、同分類裡，有一筆總額 ≈ 另外 N 筆等額的加總 → 視為同一筆分 N 期 */
function findInstGroups(list){
  const by={},out=[];
  for(const x of list){if(!x.note)continue;(by[x.acct+'|'+x.note+'|'+x.c1]||=[]).push(x)}
  for(const g of Object.values(by)){
    const cnt={};for(const x of g)(cnt[x.amount]||=[]).push(x);
    for(const [a,parts] of Object.entries(cnt)){
      const k=parts.length;if(k<2)continue;
      const total=g.find(x=>x.amount>+a&&Math.abs(x.amount-a*k)<=k);
      if(total)out.push({total,parts:parts.sort((p,q)=>p.date<q.date?-1:1)});

function doImport(){
  impSync();
  const have=new Set(db.txs.map(t=>t.impKey).filter(Boolean)),idOf={};
  for(const [nm,v] of Object.entries(imp.accts)){
    if(v.startsWith('new:')){const a={id:uid(),name:nm,type:v.slice(4),init:0,stmtDay:'',dueDay:''};db.accounts.push(a);idOf[nm]=a.id}
    else idOf[nm]=v;
  }
  for(const k of ['out','in'])for(const nm in imp.cats[k]){let c=imp.cats[k][nm];
    if(c.startsWith('＋')){c=c.slice(1);if(!db.categories[k].includes(c))db.categories[k].push(c);imp.cats[k][nm]=c}}
  let n=0,ts=Date.now();
  for(const x of imp.singles){const key=impKey(x);if(have.has(key))continue;
    const sub=imp.sub&&x.c2&&x.c2!==x.c1&&!/^其他/.test(x.c2)?x.c2:'';
    db.txs.push({id:uid(),ts:ts++,type:x.kind,amount:x.amount,accountId:idOf[x.acct],toAccountId:'',category:imp.cats[x.kind][x.c1||'其他'],
      projectId:'',date:x.date,note:[sub,x.note].filter(Boolean).join(' ').trim(),impKey:key});n++}
  for(const x of imp.pairs){const key=impKey(x);if(have.has(key))continue;
    db.txs.push({id:uid(),ts:ts++,type:'move',amount:x.amount,accountId:idOf[x.from],toAccountId:idOf[x.to],category:'轉帳',projectId:'',date:x.date,note:x.note,impKey:key});n++}
  for(const g of imp.groups){
    const members=[g.total,...g.parts];
    if(!g.on){for(const x of members){const key=impKey(x);if(have.has(key))continue;
      if(!imp.cats.out[x.c1||'其他'])imp.cats.out[x.c1||'其他']=impCatGuess(x.c1,'out').replace(/^＋/,'');
      db.txs.push({id:uid(),ts:ts++,type:'out',amount:x.amount,accountId:idOf[x.acct],toAccountId:'',category:imp.cats.out[x.c1||'其他'],projectId:'',date:x.date,note:x.note,impKey:key});n++}continue}
    const gk=impKey(g.total);if(db.installments.some(p=>p.impKey===gk))continue;
    const keys=new Set(members.map(impKey));db.txs=db.txs.filter(t=>!keys.has(t.impKey));
    let cat=imp.cats.out[g.total.c1||'其他']||impCatGuess(g.total.c1,'out');if(cat.startsWith('＋')){cat=cat.slice(1);if(!db.categories.out.includes(cat))db.categories.out.push(cat)}
    const pl={id:uid(),title:g.total.note,total:g.parts.reduce((s,x)=>s+x.amount,0),fee:0,n:g.parts.length,accountId:idOf[g.total.acct],category:cat,projectId:'',start:g.parts[0].date,impKey:gk};
    db.installments.push(pl);createInstallment(pl);n++;
  }
  const newA=Object.values(imp.accts).filter(v=>v.startsWith('new:')).length;
  imp=null;save();closeSheet();render();
  toast(`已匯入 ${n} 筆${newA?`，新增 ${newA} 個帳戶`:''}`);
}

/* ================= 到下次發薪前可用的錢 ================= */
/* 列出接下來還沒入帳的發薪（往後找幾個月） */
function upcomingPays(){
  const td=today(),t=new Date(),out=[];
  for(const j of jobs())for(let k=-1;k<=3;k++){
    const d=new Date(t.getFullYear(),t.getMonth()+k,1),ymk=`${d.getFullYear()}-${pad(d.getMonth()+1)}`,P=payInfo(j,ymk);
    /* 已經入帳（記帳日期在今天以前）才算收到；先記了未來日期的，仍當作還沒入帳 */
    if(P.tx&&P.tx.date<=td)continue;
    const date=P.tx?P.tx.date:P.date;if(date<td)continue;
    out.push({date,job:j,ym:ymk,net:P.tx?P.tx.amount:calcJob(j,ymk).net});
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function nextPayday(){return upcomingPays()[0]||null}
function runway(){
  const td=today(),pays=upcomingPays();if(!pays.length)return null;
  /* 以正職的發薪日為準；下一次發薪在 7 天內，就直接算「領完這次後撐到再下一次」 */
  const main=jobs().find(j=>j.kind==='main')||jobs()[0];
  const mp=pays.filter(x=>x.job.id===main.id);
  const P1=mp[0]||pays[0];let H=P1.date,mode='until';
  if(mp.length>1&&(pd(P1.date)-pd(td))/864e5<=7){H=mp[1].date;mode='after'}
  const incomes=pays.filter(x=>x.date<H);
  const items=[];
  const cashAccts=db.accounts.filter(a=>!a.excluded&&['cash','bank','epay'].includes(a.type));
  const have=cashAccts.reduce((s,a)=>s+balance(a),0);
  /* 信用卡：已結帳未繳＋本期＋下一期，只要繳款日在 H 之前（含當天） */
  for(const c of cards()){
    const L=cardLedger(c);
    for(const x of L.stmts)if(x.remain>0&&(!x.due||x.due<=H))items.push({name:`${c.name} 卡費`,date:x.due||td,amount:x.remain,tag:x.due&&x.due<td?'已逾期':'已結帳'});
    let credit=L.credit;
    if(L.open.due&&L.open.due<=H){const v=Math.max(0,L.open.calc-credit);credit=Math.max(0,credit-L.open.calc);if(v>0)items.push({name:`${c.name} 卡費`,date:L.open.due,amount:v,tag:'累計中'})}
    const e=pd(L.open.end),nx=cycle(c,e.getFullYear(),e.getMonth()+1);
    if(nx.due&&nx.due<=H){const v=Math.max(0,payable(c,nx.start,nx.end).total-credit);if(v>0)items.push({name:`${c.name} 卡費`,date:nx.due,amount:v,tag:'還沒開始刷'})}
  }
  for(const a of loans())for(const x of lSchedule(a))if(x.date<=H)items.push({name:a.name,date:x.date,amount:x.pay});
  for(const r of db.recurring){
    const ac=acct(r.accountId);if(!ac||ac.type==='credit'||ac.excluded)continue;
    for(const d of occurrences(r,addDays(td,1),H))items.push({name:r.name,date:d,amount:r.type==='in'?-r.amount:r.amount});
  }
  items.sort((a,b)=>a.date.localeCompare(b.date));
  const inc=incomes.reduce((s,x)=>s+x.net,0),owe=items.reduce((s,x)=>s+x.amount,0);
  const days=Math.max(1,Math.round((pd(H)-pd(td))/864e5)),left=have+inc-owe;
  const bad=cashAccts.filter(a=>balance(a)<0);
  /* 照日期一筆一筆算餘額，找出錢最不夠的那一刻：補這個數字就不會出現付不出來的時候 */
  const ev=[...incomes.map(x=>({date:x.date,v:x.net,name:x.job.name+' 薪水',inc:1})),...items.map(x=>({date:x.date,v:-x.amount,name:x.name,inc:0}))]
    .sort((a,b)=>a.date.localeCompare(b.date)||b.inc-a.inc);
  let run=have,low=have,lowAt=null,firstNeg=have<0?{date:td,name:'現在'}:null;
  for(const e of ev){run+=e.v;if(run<0&&!firstNeg)firstNeg=e;if(run<low){low=run;lowAt=e}}
  const need=Math.max(0,-low);
  return {np:P1,H,mode,have,incomes,inc,items,owe,left,days,perDay:left/days,cashAccts,bad,need,firstNeg,lowAt};
}

/* ================= 貸款利率調整 ================= */
function openLoanRate(id){
  const a=acct(id),L=a.loan,sch=lSchedule(a);if(!sch.length)return;
  window.lrDraft={id,from:sch[0].i,rate:lRate(L,sch[0].i),mode:'term',pay:''};drawLoanRate();
}
function lrSim(){
  const d=lrDraft,a=acct(d.id),L=a.loan,B0=lSchedule(a),sim=JSON.parse(JSON.stringify(a));
  const sL=sim.loan,chg={from:d.from,rate:+d.rate,fixPay:0,mode:d.mode,prevMonths:L.months};
  /* 從生效那期的剩餘本金算起 */
  const before=B0.find(x=>x.i===d.from);if(!before)return null;
  const Bf=before.bal+before.prin,r=chg.rate/100/12,oldPay=before.pay;
  if(d.mode==='pay'){
    chg.fixPay=oldPay;
    if(oldPay<=Bf*r+0.5)return {err:`新利率下每月 ${money(oldPay)} 連利息都不夠付，只能選「期數不變」`};
    const n=Math.ceil((r?-Math.log(1-Bf*r/oldPay)/Math.log(1+r):Bf/oldPay)-0.01);
    sL.months=d.from-1+n;
  }else if(+d.pay>0)chg.fixPay=+d.pay;
  sL.rateChanges=[...(sL.rateChanges||[]).filter(x=>x.from<d.from),chg];
  const after=lSchedule(sim),first=after.find(x=>x.i===d.from)||after[0];
  const intOld=B0.reduce((s,x)=>s+x.interest,0),intNew=after.reduce((s,x)=>s+x.interest,0);
  return {chg,months:sL.months,first,last:after[after.length-1],oldPay,oldLast:B0[B0.length-1],intOld,intNew};
}
function drawLoanRate(){
  const d=lrDraft,a=acct(d.id),sch=lSchedule(a),S=lrSim();
  openSheet(`<h2>利率調整</h2>
    <p class="hint">銀行通知利率變動時（例如指數型房貸、央行升降息），在這裡設定。已經扣過的期數不受影響。</p>
    <div class="two"><div class="f"><label>新的年利率（%）</label><input id="lrr" type="number" inputmode="decimal" value="${d.rate}" oninput="lrDraft.rate=this.value;lrUpd()"></div>
      <div class="f"><label>從哪一期開始</label><select id="lrf" onchange="lrDraft.from=+this.value;drawLoanRate()">${sch.slice(0,24).map(x=>`<option value="${x.i}" ${x.i===d.from?'selected':''}>第 ${x.i} 期（${x.date}）</option>`).join('')}</select></div></div>
    <div class="f"><label>銀行怎麼調整</label><select onchange="lrDraft.mode=this.value;drawLoanRate()">
      <option value="term" ${d.mode==='term'?'selected':''}>期數不變，每月金額重算（最常見）</option>
      <option value="pay" ${d.mode==='pay'?'selected':''}>每月金額不變，期數變長或變短</option></select></div>
    ${d.mode==='term'?`<div class="f"><label>銀行通知的新每月金額（選填）</label><input type="number" inputmode="decimal" value="${d.pay}" placeholder="留空自動計算" oninput="lrDraft.pay=this.value;lrUpd()"></div>`:''}
    <div id="lrPrev"></div>
    <div class="acts"><button class="btn ghost" onclick="openLoanView('${d.id}')">返回</button><button class="btn" onclick="saveLoanRate()">儲存</button></div>`);
  lrUpd();
}
function lrUpd(){
  const el=$('#lrPrev');if(!el)return;const S=lrSim();
  if(!S||!(+lrDraft.rate>=0)){el.innerHTML='';return}
  if(S.err){el.innerHTML=`<p class="hint" style="color:var(--out)">${S.err}</p>`;return}
  const dp=S.first.pay-S.oldPay,di=S.intNew-S.intOld;
  el.innerHTML=`<div class="stmt">
    <div class="row"><span>每期金額</span><b class="num">${money(S.oldPay)} → ${money(S.first.pay)}</b></div>
    <div class="sub">${dp===0?'不變':dp>0?`每月多 ${money(dp)}`:`每月少 ${money(-dp)}`}</div>
    <div class="row" style="margin-top:6px"><span>最後一期</span><b class="num">${S.oldLast.date} → ${S.last.date}</b></div>
    <div class="row" style="margin-top:6px"><span>剩餘總利息</span><b class="num">${money(S.intOld)} → ${money(S.intNew)}</b></div>
    <div class="sub">${di===0?'':di>0?`多付 ${money(di)}`:`少付 ${money(-di)}`}</div></div>`;
}
function saveLoanRate(){
  const S=lrSim();if(!S||S.err)return toast(S?S.err:'請確認輸入');
  const a=acct(lrDraft.id),L=a.loan;
  L.rateChanges=[...(L.rateChanges||[]).filter(x=>x.from!==S.chg.from),S.chg];
  if(lrDraft.mode==='pay')L.months=S.months;
  save();render();toast(`已設定第 ${S.chg.from} 期起利率 ${S.chg.rate}%`);openLoanView(a.id);
}
async function delLoanRate(id,from){
  if(!await ask(`移除第 ${from} 期起的利率變動？之後會改回前一個利率計算。`,'移除','取消'))return;
  const L=acct(id).loan,c=(L.rateChanges||[]).find(x=>x.from===from);if(c&&c.mode==='pay'&&c.prevMonths)L.months=c.prevMonths;
  L.rateChanges=(L.rateChanges||[]).filter(x=>x.from!==from);save();render();openLoanView(id);
}

      <div class="f"><label>勞工自付比例（%）</label><input id="rls" type="number" step="1" value="${R.laborSelf}"></div></div>
    <div class="two"><div class="f"><label>健保費率（%）</label><input id="rhr" type="number" step="0.01" value="${R.healthRate}"></div>
      <div class="f"><label>健保自付比例（%）</label><input id="rhs" type="number" step="1" value="${R.healthSelf}"></div></div>

    <div class="f"><label>獎金／兼職預扣 5% 門檻</label><input id="rwh" type="number" value="${R.whTh}"></div>
    ${ta('rla',R.labor,'勞保投保薪資分級')}

    <div class="acts">${ex?`<button class="btn del" onclick="delRules('${ex.from}')">刪除</button>`:''}<button class="btn ghost" onclick="openRules()">返回</button><button class="btn" onclick="saveRules('${ex?ex.from:''}')">儲存</button></div>`);

function saveRules(oldFrom){
  const g=id=>document.getElementById(id).value,nums=id=>g(id).split(/[^0-9.]+/).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
  const R={name:g('rn').trim(),from:g('rf'),laborRate:+g('rlr'),laborSelf:+g('rls'),healthRate:+g('rhr'),healthSelf:+g('rhs'),minw:+g('rmw'),supp:+g('rsp'),whTh:+g('rwh'),labor:nums('rla'),part:nums('rpa'),health:nums('rha')};
  if(!/^\d{4}-\d{2}$/.test(R.from))return toast('請選生效月份');
  if(R.from<=RULES_BUILTIN.from)return toast(`生效月份要在 ${RULES_BUILTIN.from} 之後`);
  if(!R.labor.length||!R.health.length)return toast('級距不能是空的');
  if([R.laborRate,R.laborSelf,R.healthRate,R.healthSelf,R.minw].some(v=>!(v>0)))return toast('費率和基本工資要填大於 0 的數字');
  const list=(db.salary.rules||[]).filter(r=>r.from!==oldFrom&&r.from!==R.from);list.push(R);db.salary.rules=list;
  save();render();toast(`已儲存，${R.from} 起的薪資會用新的級距計算`);openRules();
}
async function delRules(from){
  if(!await ask(`刪除 ${from} 起的級距版本？那之後的月份會改回用前一個版本計算。`))return;
  db.salary.rules=(db.salary.rules||[]).filter(r=>r.from!==from);save();render();openRules();
}

/* ================= 勞健保級距自動更新 =================
   App 每次開啟會讀同一個網站上的 rules.json（放在 GitHub 倉庫裡），有新年度版本就自動套用。 */
function fetchRules(){
  if(!/^https?:$/.test(location.protocol)||/claude\.ai|claudeusercontent|anthropic/.test(location.hostname))return;
  fetch('rules.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
    const list=Array.isArray(d)?d:d&&Array.isArray(d.versions)?d.versions:null;if(!list)return;
    const ok=list.filter(v=>v&&/^\d{4}-\d{2}$/.test(v.from)&&v.from>RULES_BUILTIN.from&&Array.isArray(v.labor)&&Array.isArray(v.health)&&v.laborRate>0&&v.healthRate>0);
    if(!ok.length)return;
    const mine=(db.salary.rules||[]).filter(r=>!r.auto),added=[];
    const autos=ok.filter(v=>!mine.some(m=>m.from===v.from)).map(v=>({...v,part:v.part||RULES_BUILTIN.part,auto:true}));
    for(const v of autos){const old=(db.salary.rules||[]).find(r=>r.auto&&r.from===v.from);if(!old||JSON.stringify(old)!==JSON.stringify(v))added.push(v)}
    if(!added.length)return;
    db.salary.rules=[...mine,...autos];save();render();
    toast(`已自動更新勞健保級距：${added.map(v=>v.name||v.from).join('、')}`);
  }).catch(()=>{});
}
/* 11 月到隔年 1 月提醒：新年度級距通常在這段時間公告 */
function rulesReminder(){
  const t=new Date(),m=t.getMonth()+1,ny=m>=11?t.getFullYear()+1:t.getFullYear();
  if(!(m>=11||m===1))return '';
  if(rulesList().some(r=>r.from.startsWith(String(ny))))return '';
  if(lay().rulesNag===ny)return '';
  return `<div class="stmt" style="margin-bottom:12px"><b>${ny} 年勞健保級距可能已經公告</b>
    <div class="sub" style="margin-top:4px">新的基本工資、級距通常在 11–12 月公告，隔年 1 月生效。跟 Claude 說「幫我更新 ${ny} 年勞健保級距」，會給你一個 rules.json，上傳到 GitHub 後 App 就會自動套用；也可以到「設定 → 勞健保級距與費率」自己改。</div>
    <button class="link" style="margin-top:6px" onclick="lay().rulesNag=${ny};save();render()">知道了，先不要提醒</button></div>`;
}

/* ================= 級距調整前後比較 ================= */
const fmt=v=>money(+v||0);
function ymAdd(ym,k){const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function rulesPrev(r){const L=rulesList(),i=L.indexOf(r);return i>0?L[i-1]:null}
function rulesDiffHTML(o,n){
  const ym=today().slice(0,7),f=v=>fmt(v),rows=[];
  const ch=(label,a,b,u='')=>{if(String(a)!==String(b))rows.push(`<div class="kv"><span>${label}</span><b>${a}${u} → ${b}${u}</b></div>`)};
  ch('基本工資',f(o.minw),f(n.minw));ch('勞保費率',o.laborRate,n.laborRate,'%');ch('勞保自付比例',o.laborSelf,n.laborSelf,'%');
  ch('健保費率',o.healthRate,n.healthRate,'%');ch('健保自付比例',o.healthSelf,n.healthSelf,'%');ch('補充保費',o.supp,n.supp,'%');ch('單次預扣 5% 門檻',f(o.whTh),f(n.whTh));
  const lv=(name,a,b)=>{if(JSON.stringify(a)!==JSON.stringify(b))rows.push(`<div class="kv"><span>${name}</span><b>${a.length} 級 ${f(a[0])}～${f(a[a.length-1])} → ${b.length} 級 ${f(b[0])}～${f(b[b.length-1])}</b></div>`)};
  lv('勞保級距',o.labor,n.labor);lv('健保級距',o.health,n.health);lv('部分工時勞保級距',o.part||[],n.part||[]);
  let h=`<div class="sub" style="margin:4px 0 6px">規定有變動的地方</div>${rows.length?rows.join(''):'<div class="sub">數字都一樣</div>'}`;
  if(jobs().length){
    h+=`<div class="sub" style="margin:12px 0 6px">對你的薪水的影響（用 ${+ym.slice(5)} 月的薪資試算）</div>`;
    for(const j of jobs()){
      const a=calcJob(j,ym,o),b=calcJob(j,ym,n),d=v=>v===0?'':`<small style="color:${v>0?'var(--in)':'var(--out)'}"> ${v>0?'+':''}${fmt(v)}</small>`;
      h+=`<div class="stmt" style="margin-bottom:8px"><b>${esc(j.name||'工作')}</b>
        <div class="kv"><span>勞保投保</span><b>${f(a.L)} → ${f(b.L)}</b></div>
        ${j.kind==='main'?`<div class="kv"><span>健保投保</span><b>${f(a.H)} → ${f(b.H)}</b></div>`:''}
        <div class="kv"><span>勞保自付</span><b>${f(a.labor)} → ${f(b.labor)}</b></div>
        ${j.kind==='main'?`<div class="kv"><span>健保自付</span><b>${f(a.health)} → ${f(b.health)}</b></div>`:''}
        <div class="kv"><span>每月實收</span><b>${f(a.net)} → ${f(b.net)}${d(b.net-a.net)}</b></div>
        ${(j.laborFix!==''&&j.laborFix!=null)||(j.healthFix!==''&&j.healthFix!=null)?'<div class="sub" style="margin-top:4px">你有照薪資單填固定的勞健保自付額，新級距生效後請照新的薪資單更新。</div>':''}
        ${(j.laborIns!==''&&j.laborIns!=null)||(j.healthIns!==''&&j.healthIns!=null)?'<div class="sub" style="margin-top:4px">你有手動填投保金額，這部分不會跟著級距自動變，公司調整後記得一起改。</div>':''}</div>`;
    }
  }
  return h;
}
function openRulesDiff(from){
  const n=rulesList().find(r=>r.from===from),o=n&&rulesPrev(n);if(!o)return;
  openSheet(`<h2>${esc(o.name||o.from)} → ${esc(n.name||n.from)}</h2><p class="hint">${n.from.replace('-',' 年 ')} 月起生效</p>${rulesDiffHTML(o,n)}
    <div class="acts"><button class="btn" onclick="closeSheet()">知道了</button></div>`);
}
/* 薪資頁：新級距快生效或剛生效時，顯示前後差異 */
function rulesChangeCard(){
  const ym=today().slice(0,7),L=rulesList();
  const n=L.find(r=>r.from>ym&&r.from<=ymAdd(ym,2))||L.find(r=>r.from<=ym&&r.from>=ymAdd(ym,-1)&&rulesPrev(r));
  if(!n||!rulesPrev(n)||lay().rulesDiffSeen===n.from)return '';
  const o=rulesPrev(n),soon=n.from>ym;
  const tot=jobs().reduce((s,j)=>s+calcJob(j,ym,n).net-calcJob(j,ym,o).net,0);
  return `<div class="card" style="border:2px solid var(--caramel)"><b>${soon?`${+n.from.slice(5)} 月起`:'這個月起'}勞健保換新級距（${esc(n.name||n.from)}）</b>
    <div class="sub" style="margin-top:4px">${jobs().length?`你每月實收預估${tot===0?'不變':tot>0?`多 ${fmt(tot)}`:`少 ${fmt(-tot)}`}。`:''}基本工資 ${fmt(o.minw)} → ${fmt(n.minw)}</div>
    <div style="display:flex;gap:14px;margin-top:6px"><button class="link" onclick="openRulesDiff('${n.from}')">看調整差異 ›</button><button class="link" onclick="lay().rulesDiffSeen='${n.from}';save();render()">知道了</button></div></div>`;
}
/* ================= 高薪低報檢查 ================= */
function underReport(j){
  if(j.kind==='part'&&!j.laborEnroll)return null;
  const a=autoIns({...j,laborIns:'',healthIns:''}),R=rulesFor();
  const has=v=>v!==''&&v!=null&&!isNaN(+v)&&+v>0;
  const L=has(j.laborIns)?+j.laborIns:null,H=j.kind==='main'&&has(j.healthIns)?+j.healthIns:null;
  const rl=L!=null&&L<a.L,rh=H!=null&&H<a.H;
  if(!rl&&!rh)return null;
  const dL=rl?a.L-L:0,dH=rh?a.H-H:0;
  const repP=Math.min(150000,H!=null?H:L!=null?L:a.P),dP=j.kind==='main'?Math.max(0,a.P-repP):0;
  return {a,L,H,rl,rh,dL,dH,dP,
    saveL:Math.round(dL*R.laborRate/100*R.laborSelf/100),saveH:Math.round(dH*R.healthRate/100*R.healthSelf/100)*(1+Math.min(3,+j.deps||0)),
    pension:Math.round(dP*0.06),unemp:Math.round(dL*0.6),annuity:Math.round(dL*0.0155*30)};
}
function underCard(){
  if(!lay().underWarn)return '';
  const list=jobs().map(j=>({j,u:underReport(j)})).filter(x=>x.u&&lay().underSeen!==`${x.j.id}:${x.j.laborIns}:${x.j.healthIns}`);
  if(!list.length)return '';
  return list.map(({j,u})=>`<div class="card" style="border:2px solid var(--out)"><b>「${esc(j.name||'工作')}」的投保金額可能被低報</b>
    <div class="sub" style="margin-top:4px">依你填的薪資 ${fmt(jobBase(j))}，${u.rl?`勞保應投保 ${fmt(u.a.L)}，目前 ${fmt(u.L)}`:''}${u.rl&&u.rh?'；':''}${u.rh?`健保應投保 ${fmt(u.a.H)}，目前 ${fmt(u.H)}`:''}。</div>
    <div style="display:flex;gap:14px;margin-top:6px"><button class="link" onclick="openUnder('${j.id}')">看影響和怎麼處理 ›</button><button class="link" onclick="lay().underSeen='${j.id}:${j.laborIns}:${j.healthIns}';save();render()">知道了</button></div></div>`).join('');
}
function openUnder(id){
  const j=jobs().find(x=>x.id===id),u=j&&underReport(j);if(!u)return;
  openSheet(`<h2>投保金額比薪資低</h2>
    <p class="hint">依你填的薪資 ${fmt(jobBase(j))} 對照級距表，${u.rl?`勞保應投保 <b>${fmt(u.a.L)}</b>，目前只有 <b>${fmt(u.L)}</b>`:''}${u.rl&&u.rh?'；':''}${u.rh?`健保應投保 <b>${fmt(u.a.H)}</b>，目前只有 <b>${fmt(u.H)}</b>`:''}。這種情況叫「高薪低報」，雇主依法要照實際薪資投保。</p>
    <div class="sub" style="margin:10px 0 6px">表面上：你每月少繳</div>

function gotQR(text){
  if(String(text).startsWith('**')){scan.right=String(text).slice(2);return}

function invDate(v){
  v=String(v||'').trim();let m;
  if((m=v.match(/^(\d{4})[\/\-.]?(\d{1,2})[\/\-.]?(\d{1,2})/))&&+m[1]>1900)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if((m=v.match(/^(\d{2,3})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))||(m=v.match(/^(\d{3})(\d{2})(\d{2})$/)))return `${+m[1]+1911}-${pad(+m[2])}-${pad(+m[3])}`;
  return '';
}
function csvSplit(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(x=>x.trim())}
function parseCarrier(text){
  const map={},get=no=>map[no]||(map[no]={no,date:'',store:'',seller:'',total:0,status:'',items:[]});
  const lines=text.replace(/^﻿/,'').split(/\r?\n/);let head=null;
  for(let raw of lines){
    let L=raw.replace(/^(表頭|明細)\s*[=＝]/,'').trim();if(!L)continue;
    if(L.includes('|')){
      const f=L.split('|').map(x=>x.trim());
      if(f[0]==='M'&&/^[A-Z]{2}-?\d{8}$/.test(f[6]||'')){const v=get(f[6].replace('-',''));v.date=invDate(f[3]);v.seller=f[4]||'';v.store=f[5]||'';v.total=parseFloat(String(f[7]).replace(/,/g,''))||0;v.status=f[8]||'';continue}
      if(f[0]==='D'&&/^[A-Z]{2}-?\d{8}$/.test(f[1]||'')){get(f[1].replace('-','')).items.push({name:f[3]||'',price:parseFloat(f[2])||0});continue}
      continue;
    }
    const f=csvSplit(L);
    if(!head&&f.some(x=>/發票號碼/.test(x))){
      const ix=re=>f.findIndex(x=>re.test(x));
      head={no:ix(/發票號碼/),date:ix(/日期/),total:ix(/總金額|發票金額|消費金額|^金額/),store:ix(/店名|商店|賣方名稱|營業人名稱/),seller:ix(/統編|統一編號/),item:ix(/品名|品項/),sub:ix(/小計|單品金額/),status:ix(/狀態/)};continue}
    if(!head)continue;
    const no=(f[head.no]||'').replace(/[-\s]/g,'');if(!/^[A-Z]{2}\d{8}$/.test(no))continue;
    const v=get(no);if(head.date>=0&&!v.date)v.date=invDate(f[head.date]);
    if(head.store>=0&&f[head.store])v.store=f[head.store];if(head.seller>=0&&f[head.seller])v.seller=f[head.seller];
    if(head.status>=0&&f[head.status])v.status=f[head.status];
    if(head.total>=0&&f[head.total])v.total=parseFloat(f[head.total].replace(/,/g,''))||v.total;
    if(head.item>=0&&f[head.item])v.items.push({name:f[head.item],price:head.sub>=0?parseFloat(f[head.sub])||0:0});
  }
  return Object.values(map).filter(v=>v.date).map(v=>{if(!v.total)v.total=v.items.reduce((s,x)=>s+x.price,0);v.totalItems=v.items.length;return v});
}

function ntfDate(t){
  const td=today(),y=+td.slice(0,4);let m;
  if((m=t.match(/(20\d{2})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/)))return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if((m=t.match(/(?:^|\D)(1\d{2})[\/.年](\d{1,2})[\/.月](\d{1,2})/)))return `${+m[1]+1911}-${pad(+m[2])}-${pad(+m[3])}`;
  if((m=t.match(/(?:^|[^\d\/])(\d{1,2})[\/月](\d{1,2})(?:日|[^\d\/]|$)/))&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31){
    let d=`${y}-${pad(+m[1])}-${pad(+m[2])}`;if(d>addDays(td,3))d=`${y-1}-${pad(+m[1])}-${pad(+m[2])}`;return d}
  if(/昨天|昨日/.test(t))return addDays(td,-1);
  return td;
}
function ntfTime(t){const m=t.match(/(?:^|\D)([01]?\d|2[0-3])[:：]([0-5]\d)(?!\d)/);return m?`${pad(+m[1])}:${m[2]}`:''}
function ntfMerchant(t){
  let m;const tidy=x=>(x||'').replace(/\s*(可用額度|剩餘額度|額度|餘額|若非本人|如非本人|如有疑問|詳情|查詢|謝謝|感謝).*$/,'').replace(/(NT\$|NTD|TWD|新臺幣|新台幣|\$)\s*[\d,.]+|[\d,.]+\s*元|\d{1,4}[\/\-.月]\d{1,2}日?|\d{1,2}[:：]\d{2}(:\d{2})?|末(四|4)碼\s*\d{4}|已?(成功|完成)|交易|消費|刷卡|付款|金額|。.*$/g,' ').replace(/^[\s,，:：、（(]+|[\s,，。:：、）)]+$/g,'').replace(/\s{2,}/g,' ').trim().slice(0,30);
  for(const re of [/(?:商店|特店|店家|商家|商戶|消費地點|地點)(?:名稱)?[:：]\s*([^\n,，。;；]+)/,/在\s*([^\n,，。]+?)\s*(?:消費|刷卡|付款)/,/於\s*([^\d\n,，。][^\n,，。]*?)\s*(?:消費|刷卡|付款)/,/[（(]([^()（）\d][^()（）]{1,25})[)）]/,
    /(?:消費|刷卡|付款|支付|交易|退款|退貨)[^\n,，。]*?(?:元|NT\$\s*[\d,]+|[\d,]+)\s*[,，]?\s*([^\n,，。\d][^\n,，。]{1,30})/,/(?:付款給|支付給|付款對象)[:：]?\s*([^\n,，。]+)/]){
    if((m=t.match(re))){const v=tidy(m[1]);if(v&&!/^(您|貴|本|此|該)/.test(v)&&!/可用額度|餘額|帳戶|卡片?$/.test(v))return v}
  }
  return '';
}
function ntfParse(raw){
  const t=raw.replace(/\s+/g,' ').trim();if(!t)return null;
  const amount=ntfAmount(t);
  /* 有些通知（例如銀行的 LINE 官方帳號）只寫「您有一筆刷卡交易」，金額要點進去才看得到 → 先認出銀行，金額讓使用者補 */
  const needAmt=!(amount>0);
  if(needAmt&&!(/消費|刷卡|交易|扣款|付款|支付/.test(t)&&(NTF_BANKS.some(b=>t.toLowerCase().includes(b.toLowerCase()))||NTF_WALLET.test(t))))return null;
  const refund=/退款|退貨|退刷|取消交易|沖正/.test(t),inc=!refund&&/轉入|入帳通知|存入|薪資入帳|收款/.test(t)&&!/消費|刷卡|付款|扣款/.test(t);
  const last4=(t.match(/末\s*(?:四|4)\s*碼\s*[:：]?\s*(\d{4})|卡號?\s*[*＊xX\-•·]+\s*(\d{4})|[*＊xX]{2,}\s*(\d{4})/)||[]).slice(1).find(Boolean)||'';
  const bank=NTF_BANKS.find(b=>t.toLowerCase().includes(b.toLowerCase()))||'';
  const wallet=(t.match(NTF_WALLET)||[''])[0];
  return {raw:raw.trim(),hash:ntfHash(t),amount:needAmt?0:amount,needAmt,type:refund||inc?'in':'out',refund,date:ntfDate(t),time:ntfTime(t),merchant:ntfMerchant(t),last4,bank,wallet,card:/信用卡|卡\s*末|刷卡|卡號|簽帳/.test(t)};
}
function ntfSplit(text){
  const out=[];
  for(const blk of text.replace(/\r/g,'').split(/\n\s*\n+/)){
    const lines=blk.split('\n').map(x=>x.trim()).filter(Boolean);
    const hasAmt=l=>ntfAmount(l)>0&&/消費|刷卡|付款|扣款|支付|交易|退款|轉帳|轉出|轉入|入帳/.test(l);
    if(lines.filter(hasAmt).length<=1){if(lines.length)out.push(lines.join('\n'));continue}
    let cur=[];for(const l of lines){cur.push(l);if(hasAmt(l)){out.push(cur.join('\n'));cur=[]}}
    if(cur.length&&out.length)out[out.length-1]+='\n'+cur.join('\n');
  }
  return out;
}
function ntfAcct(n){
  const map=lay().ntfMap||{},pool=db.accounts.filter(a=>a.type!=='loan');
  if(n.last4&&acct(map['4:'+n.last4]))return map['4:'+n.last4];
  if(n.last4){const a=pool.find(a=>(a.name+(a.note||'')).includes(n.last4));if(a)return a.id}
  const key=n.bank||n.wallet;
  if(key&&acct(map['b:'+key]))return map['b:'+key];
  if(n.bank){const L=pool.filter(a=>a.name.includes(n.bank)||(n.bank==='中國信託'&&a.name.includes('中信'))||(n.bank==='中信'&&a.name.includes('中國信託')));
    const c=L.find(a=>a.type==='credit');if(n.card&&c)return c.id;if(L[0])return L[0].id}
  if(n.wallet){const a=pool.find(a=>a.name.toLowerCase().replace(/\s/g,'').includes(n.wallet.toLowerCase().replace(/\s/g,'')));if(a)return a.id}
  return invAcct();
}
function ntfCat(n){
  if(n.type==='in')return n.refund&&db.categories.in.includes('退款')?'退款':db.categories.in.includes('其他')?'其他':db.categories.in[0];
  const k=(n.merchant||'').trim();
  if(k){const t=[...db.txs].reverse().find(x=>x.type==='out'&&x.note&&(x.note===k||x.note.startsWith(k)));if(t)return t.category}
  return guessCat({store:n.merchant,items:[]});
}
/* 週期性付款：通知的扣款日常常跟設定的日期不一樣，前後 10 天內、金額差不多就視為同一筆 */
function ntfRec(n,acc){
  const dd=(a,b)=>Math.abs((pd(a)-pd(b))/864e5),best=[],raw=(n.raw+' '+(n.merchant||'')).toLowerCase();
  const near=(r)=>Math.abs(n.amount-(+r.amount||0))<=Math.max(3,(+r.amount||0)*(r.vary?0.25:0.1));
  const nm=(r)=>{const a=(r.name||'').toLowerCase(),b=(n.merchant||'').toLowerCase();
    if(a&&b&&(a.includes(b)||b.includes(a)))return true;
    return (r.kw||'').toLowerCase().split(/[,，\s]+/).filter(Boolean).some(k=>raw.includes(k))||(a.length>=3&&raw.includes(a))};
  for(const r of db.recurring){
    if(r.type!==n.type||!near(r))continue;
    if(r.accountId!==acc&&!nm(r))continue;
    const bonus=nm(r)?-5:0;
    for(const t of db.txs)if(t.recId===r.id&&!t.recFee&&!t.ntfOk&&dd(t.date,n.date)<=10)best.push({kind:'posted',r,t,gap:dd(t.date,n.date)+bonus});
    for(const d of occurrences(r,addDays(n.date,-10),addDays(n.date,10)))
      if(!db.txs.some(t=>t.recId===r.id&&!t.recFee&&(t.recFor||t.date)===d))best.push({kind:'upcoming',r,d,gap:dd(d,n.date)+bonus});
  }
  return best.sort((a,b)=>a.gap-b.gap)[0]||null;
}
/* 同一筆消費的多則通知（例如 LINE Pay＋信用卡）：金額一樣、日期一樣、時間差 10 分鐘內 → 合併成一筆 */
function ntfMerge(list){
  const out=[];
  for(const n of list){
    const mins=x=>x.time?(+x.time.slice(0,2))*60+(+x.time.slice(3)):null;
    const g=!n.needAmt&&out.find(o=>!o.needAmt&&o.type===n.type&&Math.abs(o.amount-n.amount)<0.01&&o.date===n.date&&(mins(o)==null||mins(n)==null||Math.abs(mins(o)-mins(n))<=10));
    if(!g){out.push({...n,raws:[n.raw],hashes:[n.hash]});continue}
    g.raws.push(n.raw);g.hashes.push(n.hash);
    if(!g.time&&n.time)g.time=n.time;
    if(n.card&&!g.card){g.card=true;g.last4=n.last4||g.last4;g.bank=n.bank||g.bank}
    if(!g.last4&&n.last4)g.last4=n.last4;if(!g.bank&&n.bank)g.bank=n.bank;if(!g.wallet&&n.wallet)g.wallet=n.wallet;
    const mOk=x=>x&&!NTF_WALLET.test(x);
    if(!mOk(g.merchant)&&mOk(n.merchant))g.merchant=n.merchant;else if(!g.merchant)g.merchant=n.merchant;
  }
  return out;
}
let pst={text:'',rows:[]};
/* 自動化 App 帶進來的文字有時被編碼了兩次（%E5%9C%8B…），解到看得懂為止 */
function deepDecode(s){
  s=String(s||'');
  for(let k=0;k<4&&/%[0-9A-Fa-f]{2}/.test(s);k++){
    const d=s.replace(/(%[0-9A-Fa-f]{2})+/g,m=>{try{return decodeURIComponent(m)}catch(e){return m}});
    if(d===s)break;s=d;
  }
  return s;
}
function openPaste(text,single){

function pasteParse(){

/* 從其他 App「分享」過來的文字（安裝成 App 後，簡訊或通知可以直接分享到記帳本） */
function checkShare(){
  try{
    const raw=location.search+location.hash;if(!/[?&]share=/.test(raw))return;
    const dec=v=>{try{return decodeURIComponent(v.replace(/\+/g,' '))}catch(e){return v.replace(/\+/g,' ')}};
    const q=new URLSearchParams(location.search),parts=[q.get('title')];
    /* 自動化 App 帶進來的文字可能沒有編碼（例如店名有 & 或 #），所以 text= 之後的內容全部當成通知文字 */
    const i=raw.search(/[?&]text=/);
    parts.push(i>=0?dec(raw.slice(raw.indexOf('=',i)+1)):q.get('url'));
    const t=parts.filter(Boolean).join('\n').trim();
    history.replaceState(null,'',location.pathname);
    if(t)setTimeout(()=>openPaste(t,true),400);
  }catch(e){}
}

function syncTx(){

  if(g('pj'))draft.projectId=g('pj').value;
  if(g('nt'))draft.note=g('nt').value;

}
function setType(k){
  draft.type=k;if(k!=='out')draft.inst=false;
  const L=txLast(k);if(!db.txs.find(x=>x.id===draft.id)){if(acct(L.acc))draft.accountId=L.acc;if(k==='move'&&acct(L.acc2))draft.toAccountId=L.acc2}
  if(k!=='move'&&!db.categories[k].includes(draft.category))draft.category=topCat(k);
  if(k==='move'&&draft.toAccountId===draft.accountId)draft.toAccountId=db.accounts.find(a=>a.id!==draft.accountId)?.id;
  drawTx();
}
async function saveTx(){
  syncTx();if(!draft.date)draft.date=today();
  const amount=Math.round(parseFloat(draft.amount)*100)/100;
  if(!(amount>0))return toast('請輸入大於 0 的金額');
  if(!draft.date)return toast('請選擇日期');
  if(draft.type==='move'&&draft.accountId===draft.toAccountId)return toast('轉出和轉入帳戶不能相同');

  const cc=acct(draft.accountId);
  if(draft.type==='out'&&cc&&cc.type==='credit'&&cc.limit){
    const orig0=db.txs.find(x=>x.id===draft.id),add=(draft.inst?Math.round(amount+(parseFloat(draft.pFee)||0)):amount)-(orig0&&orig0.accountId===cc.id&&orig0.type==='out'?orig0.amount:0);
    const U=cardUse(cc,add);
    if(U.avail<0&&!await ask(`${cc.name} 額度不夠：記完這筆會超過額度 ${money(-U.avail)}。\n（額度 ${money(U.limit)}，已用 ${money(U.used-add)}）\n\n還是要記嗎？`,'照樣記','取消'))return;
  }
  if(draft.inst){
    const n=parseInt(draft.pN);
    if(!(n>=2&&n<=60))return toast('期數請填 2 到 60');
    const p={id:uid(),title:draft.note.trim()||draft.category,total:Math.round(amount),fee:Math.round(parseFloat(draft.pFee)||0),n,
      accountId:draft.accountId,category:draft.category,projectId:draft.projectId,start:draft.date};
    const o=db.txs.find(x=>x.id===draft.id);if(o)db.txs=db.txs.filter(x=>x!==o);
    db.installments.push(p);createInstallment(p);
    save();render();txBack();return toast(o?`已改成 ${n} 期分期`:`已建立 ${n} 期分期`);
  }
  const orig=db.txs.find(x=>x.id===draft.id);
  const t=Object.assign({},orig||{id:uid(),ts:Date.now()},{type:draft.type,amount,accountId:draft.accountId,
    toAccountId:draft.type==='move'?draft.toAccountId:'',category:draft.type==='move'?'轉帳':draft.category,
    projectId:draft.projectId,date:draft.date,note:draft.note.trim()});
  if(draft.inv)t.inv=draft.inv;
  if(orig&&orig.instId&&Math.abs(amount-orig.amount)>0.001){
    const sibs=db.txs.filter(x=>x.instId===orig.instId&&x.instNo>orig.instNo).sort((a,b)=>a.instNo-b.instNo);
    if(sibs.length){
      const c=await choose(`第 ${orig.instNo} 期從 ${money(orig.amount)} 改成 ${money(amount)}。\n後面還有 ${sibs.length} 期，要怎麼處理？`,
        ['只改這一期',`後面 ${sibs.length} 期重新計算（分期總額不變）`,`後面 ${sibs.length} 期也都改成 ${money(amount)}`]);
      if(c<0)return;
      if(c===1){
        const rest=Math.round((orig.amount+sibs.reduce((s,x)=>s+x.amount,0)-amount)*100)/100;
        if(rest<0)return toast('改完會超過分期總額，請檢查金額');
        const per=Math.floor(rest/sibs.length),rem=Math.round((rest-per*sibs.length)*100)/100;
        sibs.forEach((x,k)=>x.amount=per+(k===sibs.length-1?rem:0));
      }
      if(c===2)sibs.forEach(x=>x.amount=amount);
    }
  }
  if(orig)db.txs[db.txs.indexOf(orig)]=t;else db.txs.push(t);
  if(t.instId)planSync(t.instId);
  if(t.inv&&t.inv.seller&&t.type==='out')db.invCat[t.inv.seller]=t.category;
  if(!orig){const L=(lay().last||(lay().last={}));L[t.type]={acc:t.accountId,acc2:t.toAccountId||''}}
  save();render();
  if(txAgain&&!orig){txAgain=false;const k={type:t.type,accountId:t.accountId,toAccountId:t.toAccountId||draft.toAccountId,category:t.type==='move'?draft.category:t.category,date:t.date,projectId:t.projectId};
    openTx();Object.assign(draft,k);drawTx();setTimeout(()=>$('#amt')?.focus(),120);return toast('已記錄，接著記下一筆')}
  txAgain=false;txBack();toast(orig?'已更新':'已記錄');
}
async function delTx(){
  if(!await ask(draft.instId?'只刪除這一期？（要刪整筆請按「看整筆」）':'刪除這筆紀錄？'))return;
  db.txs=db.txs.filter(x=>x.id!==draft.id);if(draft.instId)planSync(draft.instId);save();render();txBack();toast('已刪除');
}

/* ---------- 分期 ---------- */
function createInstallment(p){
  const per=Math.floor(p.total/p.n),rem=p.total-per*p.n;
  const fper=Math.floor(p.fee/p.n),frem=p.fee-fper*p.n;
  const s=pd(p.start);
  for(let k=0;k<p.n;k++){
    db.txs.push({id:uid(),ts:Date.now()+k,type:'out',amount:per+fper+(k===0?rem+frem:0),accountId:p.accountId,toAccountId:'',
      category:p.category,projectId:p.projectId||'',date:ds(mkDate(s.getFullYear(),s.getMonth()+k,s.getDate())),
      note:p.title,instId:p.id,instNo:k+1,instN:p.n});
  }
}
function planSync(id){
  const p=db.installments.find(x=>x.id===id);if(!p)return;
  const ch=db.txs.filter(t=>t.instId===id);if(!ch.length)return;
  p.total=Math.round(ch.reduce((s,t)=>s+t.amount,0)-(+p.fee||0));p.n=Math.max(...ch.map(t=>t.instNo));
  ch.forEach(t=>t.instN=p.n);
}
function openPlan(id){
  const p=db.installments.find(x=>x.id===id);if(!p)return toast('找不到這筆分期');
  const ch=db.txs.filter(t=>t.instId===id).sort((a,b)=>a.instNo-b.instNo),td=today();
  const done=ch.filter(t=>t.date<=td),left=ch.filter(t=>t.date>td);
  openSheet(`<h2>${esc(p.title)}</h2>

      <div class="big num">${money(left.reduce((s,t)=>s+t.amount,0))}</div><div class="sub">尚未入帳（已入帳 ${done.length}/${ch.length} 期）</div>
      <div class="mini" style="margin:8px 20px 0"><i style="width:${ch.length?done.length/ch.length*100:0}%"></i></div></div>
    <div class="brk">${ch.map(t=>`<div class="li" onclick="openTxR('${t.id}','plan:${id}')" style="cursor:pointer"><span class="nm">第 ${t.instNo}${t.instLast?`–${t.instLast}`:''} 期<small>${t.date}</small></span>
      ${t.date>td?'<span class="tag pend">未入帳</span>':'<span class="tag ok">已入帳</span>'}<span class="num" style="min-width:76px;text-align:right">${money(t.amount)} ›</span></div>`).join('')}</div>

    <div class="acts"><button class="btn ghost" onclick="openPlanEdit('${id}')">修改分期</button>${left.length?`<button class="btn ghost" onclick="openPlanPayoff('${id}')">提前清償</button>`:''}</div>
    <div class="acts" style="margin-top:8px"><button class="btn del" onclick="delPlan('${id}')">刪除整筆分期</button><button class="btn" onclick="closeSheet()">完成</button></div>`);

async function savePlanEdit(id){
  const g=k=>document.getElementById(k),p=db.installments.find(x=>x.id===id),td=today();
  const total=parseFloat(g('pe_a').value),fee=parseFloat(g('pe_f').value)||0,n=parseInt(g('pe_n').value),start=g('pe_s').value;
  const ch=db.txs.filter(t=>t.instId===id),posted=ch.filter(t=>t.date<=td).sort((a,b)=>a.instNo-b.instNo),paid=posted.reduce((s,t)=>s+t.amount,0);
  if(!(total>0))return toast('請輸入分期總額');
  if(!(n>=1&&n<=60))return toast('期數請填 1 到 60');
  if(n<posted.length)return toast(`已經入帳 ${posted.length} 期，總期數不能少於這個數字`);
  const rest=Math.round((total+fee-paid)*100)/100,cnt=n-posted.length;
  if(rest<-0.01)return toast('新的總額比已入帳的金額還少，請檢查');
  if(cnt===0&&rest>0.01)return toast(`還有 ${money(rest)} 沒分到，請把期數加大`);
  Object.assign(p,{title:g('pe_t').value.trim()||p.title,total:Math.round(total),fee:Math.round(fee),n,start,accountId:g('pe_ac').value,category:g('pe_c').value});
  db.txs=db.txs.filter(t=>!(t.instId===id&&t.date>td));
  posted.forEach(t=>{t.note=p.title;t.category=p.category;t.accountId=p.accountId;t.instN=n});
  const s0=pd(start),per=cnt?Math.floor(rest/cnt):0,rem=Math.round((rest-per*cnt)*100)/100;
  for(let k=posted.length;k<n;k++){
    let d=ds(mkDate(s0.getFullYear(),s0.getMonth()+k,s0.getDate()));if(d<=td)d=addDays(td,1);
    db.txs.push({id:uid(),ts:Date.now()+k,type:'out',amount:per+(k===posted.length?rem:0),accountId:p.accountId,toAccountId:'',category:p.category,projectId:p.projectId||'',date:d,note:p.title,instId:id,instNo:k+1,instN:n});
  }
  delete p.settled;save();render();openPlan(id);toast('已更新分期');
}

function savePlanPayoff(id){
  const p=db.installments.find(x=>x.id===id),td=today(),d=$('#po_d').value||td,amt=parseFloat($('#po_a').value);
  const left=db.txs.filter(t=>t.instId===id&&t.date>td).sort((a,b)=>a.instNo-b.instNo);if(!left.length)return;

      :`<div class="two"><div class="f"><label>開始</label><input type="date" value="${pay.from}" onchange="pay.from=this.value;drawPay()"></div>
         <div class="f"><label>結束</label><input type="date" value="${pay.to}" onchange="pay.to=this.value;drawPay()"></div></div>`}

/* ---------- App 內確認視窗（有些瀏覽器／預覽環境會擋掉原生 confirm）---------- */
function ask(msg,ok='確定',cancel='取消'){
  return new Promise(res=>{
    const w=document.createElement('div');w.className='askbg';
    const danger=/刪除|清除|取代/.test(msg)&&ok==='確定';
    w.innerHTML=`<div class="askbox"><div class="askmsg"></div><div class="acts"><button class="btn ghost" data-v="0"></button><button class="btn${danger?' warn':''}" data-v="1"></button></div></div>`;
    w.querySelector('.askmsg').textContent=msg;
    const [b0,b1]=w.querySelectorAll('button');b0.textContent=cancel;b1.textContent=danger?(msg.includes('刪除')?'刪除':ok):ok;
    const done=v=>{w.remove();res(v)};
    b0.onclick=()=>done(false);b1.onclick=()=>done(true);w.onclick=e=>{if(e.target===w)done(false)};
    document.body.appendChild(w);requestAnimationFrame(()=>w.classList.add('on'));
  });
}

/* ---------- 貸款 ---------- */
const lpDate0=(a,i)=>{const f=pd(a.loan.first);return ds(mkDate(f.getFullYear(),f.getMonth()+i-1,f.getDate()))};
/* 扣款日遇假日：銀行通常延到下一個上班日扣 */
const lpDate=(a,i)=>{let d=lpDate0(a,i);if(a.loan.hol==='after')for(let k=0;k<15&&offReason(d);k++)d=addDays(d,1);return d};
function lBal(a,before){
  const since=a.loan.setAt||0;
  const paid=db.txs.filter(t=>t.type==='move'&&t.toAccountId===a.id&&(t.loanNo||(t.ts||0)>since)&&(before==null||t.date<before)).reduce((s,t)=>s+t.amount,0);
  return Math.max(0,Math.round((a.loan.principal-paid)*100)/100);
}
const lNextNo=a=>db.txs.filter(t=>t.loanId===a.id&&t.loanNo).reduce((m,t)=>Math.max(m,t.loanNo),0)+1;
/* 利率調整：L.rateChanges=[{from:期數,rate,fixPay}]，第 i 期用最後一筆 from<=i 的設定 */
function lChg(L,i){let c=null;for(const x of (L.rateChanges||[]))if(x.from<=i&&(!c||x.from>=c.from))c=x;return c}
function lRate(L,i){const c=lChg(L,i);return c?+c.rate:+L.rate||0}
function lFix(L,i){const c=lChg(L,i);return c?(+c.fixPay>0?+c.fixPay:0):(+L.fixPay>0?+L.fixPay:0)}
/* 「月付不變、期數改變」的調整只影響生效後的期數；之前的期數照原本的總期數計算 */
function lMonths(L,i){let m=L.months,f=Infinity;for(const x of (L.rateChanges||[]))if(x.mode==='pay'&&x.from>i&&x.from<f&&x.prevMonths){f=x.from;m=x.prevMonths}return m}
function lCalc(a,i,B){
  const L=a.loan,r=lRate(L,i)/100/12,n=lMonths(L,i)-i+1,interest=Math.round(B*r);
  let prin;
  if(i<=(+L.grace||0))prin=0;
  else if(n<=1)prin=B;
  else if(L.method==='equal')prin=Math.round(B/(n));
  else{const fx=lFix(L,i),pay=fx||(r?B*r/(1-Math.pow(1+r,-n)):B/n);prin=Math.round(pay-interest)}
  prin=Math.min(Math.max(prin,0),B);
  /* 單期實際金額（照銀行通知填）：本金照計畫，差額算在利息 */
  const adj=+((L.payAdj||{})[i])||0;let it=interest;
  if(adj>0){if(adj>=prin)it=adj-prin;else{prin=adj;it=0}}
  return {i,date:lpDate(a,i),interest:it,prin,pay:prin+it,bal:B-prin,adj:adj>0};
}
function lSchedule(a){
  const out=[];let B=lBal(a);
  for(let i=lNextNo(a);i<=a.loan.months&&B>0.5;i++){const x=lCalc(a,i,B);out.push(x);B=x.bal}
  return out;
}
function loanMeta(a){const nx=lSchedule(a)[0];return nx?`下次 ${md(nx.date)} 扣 ${money(nx.pay)}・剩 ${a.loan.months-nx.i+1} 期`:'已還清'}
function postLoanPeriod(a,i,prin,interest,date,from){
  if(!db.categories.out.includes('貸款利息'))db.categories.out.push('貸款利息');
  if(prin>0)db.txs.push({id:uid(),ts:Date.now(),type:'move',amount:prin,accountId:from,toAccountId:a.id,category:'轉帳',projectId:'',date,note:`${a.name} 第 ${i} 期本金`,loanId:a.id,loanNo:i});
  db.txs.push({id:uid(),ts:Date.now()+1,type:'out',amount:interest,accountId:from,toAccountId:'',category:'貸款利息',projectId:'',date,note:`${a.name} 第 ${i} 期利息`,loanId:a.id,loanNo:i});
}
function postLoans(){
  const td=today();let n=0;
  for(const a of loans()){
    if(!a.loan.auto||!acct(a.loan.payFrom))continue;
    for(let i=lNextNo(a);i<=a.loan.months;i++){
      const d=lpDate(a,i);if(d>td)break;
      const B=lBal(a,d);if(B<=0.5)break;
      const x=lCalc(a,i,B);postLoanPeriod(a,i,x.prin,x.interest,d,a.loan.payFrom);n++;
    }
  }
  if(n)save();return n;
}

const JAR_EMOJI=['🐷','✈️','🏠','🎁','📱','💍','🚗','🎓','🛟','🎮','👜','🐶'];
const jarSaved=j=>Math.round(j.entries.reduce((s,e)=>s+(+e.amount||0),0)*100)/100;
function jarPlan(j){
  const saved=jarSaved(j),left=Math.max(0,(+j.target||0)-saved),td=today();
  if(!j.deadline||!left||j.deadline<=td)return {saved,left,months:0,perMonth:0,perWeek:0};
  const days=Math.max(1,Math.round((pd(j.deadline)-pd(td))/864e5)),months=Math.max(1,Math.ceil(days/30.44));
  return {saved,left,months,days,perMonth:Math.ceil(left/months),perWeek:Math.ceil(left/Math.max(1,Math.ceil(days/7)))};
}
/* 自動存入：每月 X 日或每週 X */
function jarDue(j,from,to){
  const out=[],A=j.auto;if(!A||!(+A.amount>0))return out;
  for(let d=from;d<=to;d=addDays(d,1)){
    const D=pd(d);
    if(A.freq==='week'?D.getDay()===(+A.day%7):D.getDate()===Math.min(+A.day||1,new Date(D.getFullYear(),D.getMonth()+1,0).getDate()))out.push(d);
  }
  return out;
}
function postJars(){
  const td=today();let n=0;
  for(const j of db.jars){
    if(!j.auto||!(+j.auto.amount>0)||j.done)continue;
    const from=j.auto.posted?addDays(j.auto.posted,1):(j.auto.start||td);
    for(const d of jarDue(j,from,td)){
      if(j.target&&jarSaved(j)>=+j.target)break;
      jarAdd(j,+j.auto.amount,d,'自動存入',true);n++;
    }
    j.auto.posted=td;
  }
  if(n)save();return n;
}
function jarAdd(j,amt,date,note,auto,xfer){
  const e={id:uid(),date,amount:amt,note:note||'',auto:!!auto};
  const fr=xfer?xfer.from:j.auto&&auto?j.auto.from:'',to=j.acct||'';
  if(fr&&to&&fr!==to&&acct(fr)&&acct(to)){
    const t={id:uid(),ts:Date.now(),type:'move',amount:Math.abs(amt),accountId:amt>0?fr:to,toAccountId:amt>0?to:fr,category:'轉帳',projectId:'',date,note:`存錢罐「${j.name}」${amt>0?'存入':'取出'}`,jarId:j.id};
    db.txs.push(t);e.txId=t.id;
  }
  j.entries.push(e);
  if(j.target&&!j.done&&jarSaved(j)>=+j.target){j.done=today();setTimeout(()=>toast(`🎉「${j.name}」存滿了！`),300)}
  return e;
}

function saveJar(id){
  const g=k=>document.getElementById(k),name=g('jn2').value.trim();
  if(!name)return toast('請輸入名稱');
  const target=parseFloat(g('jt2').value)>0?parseFloat(g('jt2').value):0,amt=parseFloat(g('jaa').value)>0?parseFloat(g('jaa').value):0;
  const auto={amount:amt,freq:g('jaf').value,day:+g('jad').value||1,from:g('jaff').value};
  let j=id?db.jars.find(x=>x.id===id):null;
  if(!j){j={id:uid(),entries:[],created:today()};db.jars.push(j)}
  const old=j.auto||{};
  if(amt&&(!old.amount||old.freq!==auto.freq||+old.day!==auto.day)){auto.start=today();auto.posted=''}else{auto.start=old.start||today();auto.posted=old.posted||''}
  Object.assign(j,{name,emoji:jdr.emoji,target,deadline:g('jdl').value,acct:g('jac2').value,auto});
  if(target&&jarSaved(j)<target)j.done='';
  postJars();save();render();openJar(j.id);toast('已儲存');
}
async function delJar(id){
  const j=db.jars.find(x=>x.id===id);
  if(!await ask(`刪除存錢罐「${j.name}」和它的 ${j.entries.length} 筆紀錄？${j.entries.some(e=>e.txId)?'\n\n一起記的轉帳會保留在明細，不會刪除。':''}`))return;
  db.jars=db.jars.filter(x=>x.id!==id);save();closeSheet();render();toast('已刪除');
}

/* ================= 帳戶明細（銀行、現金、電子支付） ================= */
let avId,avYm,avQ='';
function acctFlow(a){
  /* 每一筆對這個帳戶的影響（+ 進、- 出），照日期排序並算出每筆之後的餘額 */
  const td=today(),rows=[];
  for(const t of db.txs){
    let v=0,other='';
    if(t.type==='out'&&t.accountId===a.id)v=-t.amount;
    else if(t.type==='in'&&t.accountId===a.id)v=t.amount;
    else if(t.type==='move'&&t.accountId===a.id){v=-t.amount;other=acctName(t.toAccountId)}
    else if(t.type==='move'&&t.toAccountId===a.id){v=t.amount;other=acctName(t.accountId)}
    if(v)rows.push({t,v,other,future:t.date>td});
  }
  rows.sort((x,y)=>x.t.date.localeCompare(y.t.date)||(x.t.ts||0)-(y.t.ts||0));
  let b=+a.init||0;for(const r of rows){if(!r.future)b+=r.v;r.bal=b}
  return rows;
}

function loanPrev(){
  const g=k=>document.getElementById(k),el=g('lprev');if(!el)return;
  const B=parseFloat(g('lp').value),rt=parseFloat(g('lr').value),n=parseInt(g('lm').value),fix=parseFloat(g('lfix').value),gr=parseInt(g('lg').value)||0;
  if(!(B>0)||!(rt>=0)||!(n>=1)){el.innerHTML='填好剩餘本金、利率、期數，這裡會顯示每期大約扣多少，可以跟銀行實際扣款對照。';return}
  const r=rt/100/12,m=n-gr;
  if(g('lmt').value==='equal'){el.innerHTML=`第一期約 <b>${money(Math.round(B/m+B*r))}</b>，之後每期遞減`;return}
  const calc=m<1?B:(r?B*r/(1-Math.pow(1+r,-m)):B/m);
  let t=`依這些資料，每期約 <b>${money(Math.round(calc))}</b>`;
  if(fix>0){
    if(fix<=B*r+0.5)t+=`<br><span style="color:var(--red,#d9534f)">固定金額 ${money(fix)} 連利息都不夠付，請檢查</span>`;
    else{const k=Math.ceil((r?-Math.log(1-B*r/fix)/Math.log(1+r):B/fix)-0.1);
      const d=Math.round(fix-calc);
      t+=`；你填的 ${money(fix)} ${Math.abs(d)<=Math.max(5,calc*0.003)?'✓ 吻合':`差 ${d>0?'+':''}${money(d)}`}，照這個金額約 ${k} 期還完${Math.abs(k-m)>1?`（跟剩餘 ${m} 期對不上，剩餘本金或利率可能要再確認）`:''}`}
  }
  el.innerHTML=t;
}
function loanConv(mode){
  const g=k=>document.getElementById(k),rt=parseFloat(g('lr').value);
  if(!(rt>=0))return toast('請先填年利率');
  const r=rt/100/12;let B,n;
  if(mode===1){
    const P=parseFloat(g('cv0').value),N=parseInt(g('cv1').value),k=parseInt(g('cv2').value);
    if(!(P>0)||!(N>=1)||!(k>=0)||k>=N)return toast('請填原始金額、總期數、已繳期數');
    if(g('lmt').value==='equal')B=P-P/N*k;
    else{const pay=r?P*r/(1-Math.pow(1+r,-N)):P/N;B=r?P*Math.pow(1+r,k)-pay*(Math.pow(1+r,k)-1)/r:P-pay*k;
      if(!g('lfix').value)g('lfix').value=Math.round(pay)}
    n=N-k;
  }else{
    const pay=parseFloat(g('cv3').value);n=parseInt(g('cv4').value);
    if(!(pay>0)||!(n>=1))return toast('請填每月繳款金額與剩餘期數');
    B=r?pay*(1-Math.pow(1+r,-n))/r:pay*n;g('lfix').value=pay;g('lmt').value='annuity';
  }
  g('lp').value=Math.round(B);g('lm').value=n;g('lg').value=0;loanPrev();
  toast(`已帶入：剩餘本金 ${money(Math.round(B))}、剩餘 ${n} 期`);
}
async function saveLoan(){
  const g=id=>document.getElementById(id);
