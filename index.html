  if(!name)return toast('請輸入名稱');
  if(!(principal>0))return toast('請輸入剩餘本金');
  if(!(rate>=0))return toast('請輸入年利率，沒有利息填 0');
  if(!(months>=1))return toast('請輸入剩餘期數');
  if(!first)return toast('請選擇扣款日');
  const grace=Math.max(0,parseInt(g('lg').value)||0);
  if(grace>=months)return toast('寬限期要少於剩餘期數');
  const fixPay=parseFloat(g('lfix').value)>0?parseFloat(g('lfix').value):0;
  if(fixPay&&g('lmt').value==='annuity'&&fixPay<=principal*rate/1200)return toast('固定繳款金額比每月利息還少，請檢查');
  const loan={principal,rate,months,first,fixPay,method:g('lmt').value,grace,payFrom:g('lfrom').value,auto:g('lauto').checked,hol:g('lhol').value};
  const excluded=g('lex').checked;
  if(ldraft.id){
    const a0=acct(ldraft.id),started=lNextNo(a0)>1;
    loan.setAt=started?(a0.loan.setAt||0):Date.now();
    if(!started){
      const old=db.txs.filter(t=>t.toAccountId===ldraft.id&&t.type==='move'&&!t.loanNo);
      if(old.length){
        const sum=old.reduce((x,t)=>x+t.amount,0);
        if(await ask(`這筆貸款之前有 ${old.length} 筆還款／提前還款紀錄，共 ${money(sum)}。\n\n你填的剩餘本金 ${money(principal)} 已經是現在的餘額，這些舊紀錄不會再扣一次。\n\n要把它們從明細刪掉嗎？（如果是測試用的建議刪除，銀行帳戶餘額才會正確）`))
          db.txs=db.txs.filter(t=>!old.includes(t));
      }
    }
  }else loan.setAt=Date.now();
  if(ldraft.id){const a=acct(ldraft.id);if(a.loan&&a.loan.rateChanges)loan.rateChanges=a.loan.rateChanges;if(a.loan&&a.loan.payAdj)loan.payAdj=a.loan.payAdj;a.name=name;a.init=-principal;a.loan=loan;a.excluded=excluded}
  else db.accounts.push({id:uid(),name,type:'loan',init:-principal,loan,excluded});
  const n=postLoans();save();render();
  const id=ldraft.id||db.accounts[db.accounts.length-1].id;openLoanView(id);
  toast(n?`已儲存，並補記 ${n} 期還款`:'已儲存貸款');
}

function rulesFor(ym){ym=ym||today().slice(0,7);let r=RULES_BUILTIN;for(const x of rulesList())if(x.from<=ym)r=x;return r}
const gradeUp=(list,v)=>list.find(x=>x>=v)??list[list.length-1];
const jobs=()=>db.salary.jobs;
const jobBase=j=>j.pay==='hourly'?Math.round((+j.hourly||0)*(+j.hoursDefault||0)):(+j.amount||0);
function autoIns(j,ym,R0){
  const b=jobBase(j),isPart=j.kind==='part',R=R0||rulesFor(ym),mw=+R.minw||MINW;
  const L=isPart&&!j.laborEnroll?0:isPart&&b<mw?gradeUp(R.part,b):gradeUp(R.labor,Math.max(b,mw));
  const H=isPart?0:gradeUp(R.health,Math.max(b,mw));
  return {L,H,P:isPart?0:Math.min(150000,H)};
}
function jobIns(j,ym,R0){
  const a=autoIns(j,ym,R0);
  return {L:j.laborIns!==''&&j.laborIns!=null&&(j.kind==='main'||j.laborEnroll)?+j.laborIns:a.L,
    H:j.kind==='main'&&j.healthIns!==''&&j.healthIns!=null?+j.healthIns:a.H,P:a.P};
}
function taxTable(m,deps){
  const net=m*12-(101000*(1+deps)+272000+227000);if(net<=0)return 0;
  const B=[[610000,.05,0],[1380000,.12,42700],[2770000,.2,153100],[5190000,.3,430100],[Infinity,.4,949100]];
  const [,r,d]=B.find(b=>net<=b[0]);const x=Math.round((net*r-d)/12);return x<=2000?0:x;
}
const monthRec=(ym,id)=>((db.salary.months[ym]||{})[id])||{};
function calcJob(j,ym,R0){
  const r=monthRec(ym,j.id),isPart=j.kind==='part';
  const hours=r.hours!=null&&r.hours!==''?+r.hours:+j.hoursDefault||0;
  const base=j.pay==='hourly'?Math.round((+j.hourly||0)*hours):(+j.amount||0);
  const hr=j.pay==='hourly'?(+j.hourly||0):(+j.amount||0)/30/8;
  const personal=j.pay==='hourly'?0:Math.round(hr*(+r.personal||0));
  const sick=j.pay==='hourly'?0:Math.round(hr*(+r.sick||0)*0.5);
  const extra=+r.extra||0,deduct=+r.deduct||0;
  const gross=Math.max(0,base-personal-sick+extra);
  const {L,H,P}=jobIns(j,ym,R0),R=R0||rulesFor(ym);
  const none=gross<=0&&!extra; /* 還沒填時數：先不算扣款，避免出現負數 */
  const has=v=>v!==''&&v!=null&&!isNaN(+v);
  const labor=none?0:has(j.laborFix)?+j.laborFix:L?Math.round(L*R.laborRate/100*R.laborSelf/100):0;
  const deps=Math.min(3,+j.deps||0);
  const health=none?0:has(j.healthFix)?+j.healthFix:H?Math.round(H*R.healthRate/100*R.healthSelf/100)*(1+deps):0;
  const pension=isPart?0:Math.round(P*(+j.pension||0)/100);
  const supp=isPart&&gross>=R.minw?Math.round(gross*R.supp/100):0;
  const taxable=gross-pension;
  const wh=isPart?(gross>=R.whTh?Math.round(gross*0.05):0):j.withhold==='flat5'?(taxable>40020?Math.round(taxable*0.05):0):taxTable(taxable,+j.taxDeps||0);
  const net=gross-labor-health-pension-supp-wh-deduct;
  return {hours,base,personal,sick,extra,deduct,gross,L,H,labor,health,deps,pension,supp,wh,net};
}
function calcBonuses(year){
  const out={};
  for(const j of jobs()){
    const list=db.salary.bonuses.filter(b=>b.jobId===j.id&&b.date.startsWith(year)).sort((a,b)=>a.date.localeCompare(b.date));
    const th=4*jobIns(j,`${year}-12`).H;let cum=0;
    for(const b of list){
      const amt=+b.amount||0,R=rulesFor(b.date.slice(0,7));let supp;
      if(j.kind==='main'){const before=Math.max(0,cum-th);cum+=amt;supp=Math.round(Math.min(Math.max(0,cum-th)-before,1e7)*R.supp/100)}
      else supp=amt>=R.minw?Math.round(amt*R.supp/100):0;
      const wh=amt>=R.whTh?Math.round(amt*0.05):0;
      out[b.id]={supp,wh,net:amt-supp-wh,cum:j.kind==='main'?cum:null,th:j.kind==='main'?th:null};
    }
  }
  return out;
}
/* 金錢配置用：這個月「實際入帳」的錢（例如 9 月份薪水 10/5 發，就算在 10 月） */
function cashIncome(ym){
  const y=+ym.slice(0,4),m=+ym.slice(5)-1,items=[];
  for(const j of jobs())for(const k of [-2,-1,0]){
    const d=new Date(y,m+k,1),wm=`${d.getFullYear()}-${pad(d.getMonth()+1)}`,P=payInfo(j,wm);
    const date=P.tx?P.tx.date:P.date;if(!date.startsWith(ym))continue;
    items.push({j,wm,date,net:P.tx?P.tx.amount:calcJob(j,wm).net,got:!!P.tx});
  }
  const bc=calcBonuses(ym.slice(0,4));
  const B=db.salary.bonuses.filter(b=>b.date.startsWith(ym)&&acctJob(b.jobId)).map(b=>({b,c:bc[b.id]}));
  return {items,B,salary:items.reduce((s,x)=>s+x.net,0),bonus:B.reduce((s,x)=>s+x.c.net,0)};
}
function monthIncome(ym){
  const J=jobs().map(j=>({j,c:calcJob(j,ym)}));
  const bc=calcBonuses(ym.slice(0,4));
  const B=db.salary.bonuses.filter(b=>b.date.startsWith(ym)&&acctJob(b.jobId)).map(b=>({b,c:bc[b.id]}));
  return {J,B,salary:J.reduce((s,x)=>s+x.c.net,0),bonus:B.reduce((s,x)=>s+x.c.net,0)};
}

const holCache={};
function holYear(y){
  y=String(y);if(TW_HOL_BUILTIN[y])return TW_HOL_BUILTIN[y];
  if(holCache[y]!==undefined)return holCache[y];
  try{const v=localStorage.getItem('tw_hol_'+y);holCache[y]=v?JSON.parse(v):null}catch(e){holCache[y]=null}
  return holCache[y];
}
function fetchHolidays(){
  const y=new Date().getFullYear();
  for(const yy of [y,y+1]){
    if(holYear(yy))continue;
    fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${yy}.json`).then(r=>r.ok?r.json():null).then(d=>{
      if(!Array.isArray(d)||d.length<300)return;
      const o={h:{},w:[]};
      for(const x of d){const md=x.date.slice(4),we=x.week==='六'||x.week==='日';
        if(x.isHoliday&&(!we||x.description))o.h[md]=x.description||'國定假日';if(!x.isHoliday&&we)o.w.push(md)}
      holCache[yy]=o;try{localStorage.setItem('tw_hol_'+yy,JSON.stringify(o))}catch(e){}
      render();
    }).catch(()=>{});
  }
}
/* 回傳這天放假的原因；上班日回傳空字串 */
function offReason(s){
  const Y=holYear(s.slice(0,4)),k=s.slice(5,7)+s.slice(8,10),w=pd(s).getDay();
  if(Y&&Y.w.includes(k))return '';
  if(Y&&Y.h[k])return Y.h[k];
  return w===0?'星期日':w===6?'星期六':'';
}
/* 發薪日：當月或次月發、遇假日照原日／提前／延後、單月手動改 */
function expectedPay(j,ym0){return payShift(j,ym0).date}
function payShift(j,ym0){
  const y=+ym0.slice(0,4),m=+ym0.slice(5)-1+(j.payMonth==='next'?1:0);
  const orig=ds(mkDate(y,m,+j.payDay||5));let d=orig;
  const why=offReason(orig),step=j.holiday==='before'?-1:j.holiday==='after'?1:0;
  if(why&&step)for(let i=0;i<20&&offReason(d);i++)d=addDays(d,step);
  return {orig,date:d,why,moved:d!==orig,noData:!holYear(orig.slice(0,4))};
}
function payInfo(j,ym0){
  const S=payShift(j,ym0),exp=S.date,ov=monthRec(ym0,j.id).payDate,date=ov||exp,td=today();
  const tx=db.txs.find(t=>t.salaryKey===ym0+'|'+j.id);
  const days=Math.round((pd(date)-pd(td))/864e5);
  let st,cls='';
  if(tx){st=`已入帳 ${md(tx.date)}`;cls='ok'}
  else if(days<0){st=ov?`延後到 ${md(date)}，已過 ${-days} 天還沒入帳`:`過了發薪日 ${-days} 天還沒入帳`;cls='late'}

  return {exp,date,ov:!!ov,tx,days,st,cls,S,delay:ov?Math.round((pd(ov)-pd(exp))/864e5):0};

function fixedCosts(ym){
  const a=ym+'-01',z=ym+'-'+pad(mlen(+ym.slice(0,4),+ym.slice(5)-1));let loan=0,rec=0;
  for(const L of loans()){
    const sch=lSchedule(L);
    let v=db.txs.filter(t=>t.loanId===L.id&&t.loanNo&&t.date>=a&&t.date<=z).reduce((s,t)=>s+t.amount,0)
      +sch.filter(x=>x.date>=a&&x.date<=z).reduce((s,x)=>s+x.pay,0);
    /* 設定前的月份（例如下一期在下個月）也照每月月付金額算，因為這個月其實也有繳 */
    if(!v&&sch.length&&z<sch[0].date&&lNextNo(L)===1)v=sch[0].pay;
    loan+=v;
  }
  const A0=db.salary.alloc||{},useCards=A0.cardBills!==false,cardItems=[];
  if(useCards){
    /* 這個月要繳的信用卡帳單：繳款日落在這個月的那一期 */
    const y=+ym.slice(0,4),m=+ym.slice(5)-1;
    for(const c of cards()){
      if(!c.stmtDay||!c.dueDay)continue;
      for(let k=-2;k<=1;k++){
        const cy=cycle(c,y,m+k);if(!cy.due||!cy.due.startsWith(ym))continue;
        const st=db.stmts[skey(c,cy.end)]||{},bank=st.bank!=null&&st.bank!==''?+st.bank:null;
        const amt=Math.round(bank??payable(c,cy.start,cy.end).total);
        if(amt>0)cardItems.push({name:c.name,amount:amt,due:cy.due,closed:cy.end<today()});
      }
    }
    cardItems.sort((x,y)=>x.due.localeCompare(y.due));
  }
  const cardsTot=cardItems.reduce((s,x)=>s+x.amount,0);
  for(const r of db.recurring){
    if(r.type!=='out'||(r.end&&r.end<a))continue;
    if(useCards&&acct(r.accountId)?.type==='credit')continue; /* 刷卡的週期性付款已經包含在卡費裡 */
    let k=occurrences(r,a,z).length;
    if(!k&&r.freq==='monthly'&&r.start>z)k=1;
    rec+=k*r.amount;
  }
  const A=db.salary.alloc||{},items=(A.fixedItems||[]).filter(x=>+x.amount>0);
  const other=items.reduce((s,x)=>s+(+x.amount),0);
  return {loan,rec,other,items,cards:cardsTot,cardItems,total:loan+rec+other+cardsTot};
}
function allocCalc(ym){
  const A=db.salary.alloc||=defaultAlloc(),inc=cashIncome(ym);
  const base=inc.salary+(A.withBonus?inc.bonus:0),fx=A.fixed?fixedCosts(ym):{loan:0,rec:0,other:0,items:[],cards:0,cardItems:[],total:0};
  const remain=Math.max(0,base-fx.total);
  const fxCats=A.fixed?(A.fixedItems||[]).map(x=>x.cat).filter(Boolean):[];
  const mt=db.txs.filter(t=>t.type==='out'&&t.date.startsWith(ym)&&!t.recId&&!t.loanId&&!fxCats.includes(t.category));
  const U=A.round==null?100:+A.round||1;
  /* 入不敷出：固定支出比實收多，或（本月）發薪前的錢不夠付 → 先處理支出，其餘先不分配 */
  const isNow=ym===today().slice(0,7),rw=isNow&&A.holdShort!==false?runway():null;
  const shortFix=A.fixed&&base<fx.total,shortRw=!!(rw&&rw.need>0);
  const hold=A.holdShort!==false&&(shortFix||shortRw);
  const dist=hold?0:remain;
  /* 固定支出依到期先後，看實收夠付到哪裡 */
  const payList=[...fx.cardItems.map(x=>({name:x.name+' 卡費',date:x.due,amount:x.amount})),
    ...(fx.loan?[{name:'貸款',amount:fx.loan}]:[]),...(fx.rec?[{name:'週期性付款',amount:fx.rec}]:[]),
    ...fx.items.map(x=>({name:x.name||'固定支出',amount:+x.amount}))];
  let pool=base;for(const x of payList){x.covered=Math.min(pool,x.amount);pool-=x.covered}
  const rows=A.buckets.map(b=>({b,amt:Math.floor(dist*(+b.pct||0)/100/U)*U,
    spent:b.cats.length?mt.filter(t=>b.cats.includes(t.category)).reduce((s,t)=>s+t.amount,0):null}));
  const pctSum=A.buckets.reduce((s,b)=>s+(+b.pct||0),0);
  const rest=hold?0:pctSum>=100?remain-rows.reduce((s,r)=>s+r.amt,0):0;
  return {A,base,fx,remain,rows,rest,U,hold,shortFix,shortRw,rw,payList,inc};
}

async function setPayDate(id,v){
  const j=acctJob(id),ym0=ym(),M=db.salary.months[ym0]||={},r=M[id]||={};
  if(!v||v===expectedPay(j,ym0))delete r.payDate;else r.payDate=v;
  const tx=db.txs.find(t=>t.salaryKey===ym0+'|'+id);
  if(tx&&v&&tx.date!==v&&await ask('這個月的薪資已經記入帳本，要把入帳日也改成新日期嗎？'))tx.date=v;
  save();render();
}
function setMonthVal(id,k,v){
  const M=db.salary.months[ym()]||={};const r=M[id]||={};
  if(v==='')delete r[k];else r[k]=parseFloat(v);
  save();renderPay();
}
async function recordSalary(id){
  const j=acctJob(id),ym0=ym(),c=calcJob(j,ym0),key=ym0+'|'+id;
  if(!j.accountId||!acct(j.accountId))return toast('請先在薪資設定選好入帳帳戶');
  const old=db.txs.find(t=>t.salaryKey===key),pdate=payInfo(j,ym0).date;
  if(!old&&pdate>today()&&!await ask(`這是 ${cur.getMonth()+1} 月份的薪水，預計 ${md(pdate)} 才會入帳。\n\n確定要現在先記嗎？（會先顯示「未入帳」，到 ${md(pdate)} 才算進餘額）\n\n如果你要記的是剛領到的薪水，請按「取消」，切到上一個月再記。`,'先記起來','取消'))return;
  if(old&&!await ask(`這個月已經記過 ${money(old.amount)}，要改成 ${money(c.net)} 嗎？`))return;
  if(!db.categories.in.includes('薪資'))db.categories.in.unshift('薪資');
  const t={id:old?.id||uid(),ts:Date.now(),type:'in',amount:c.net,accountId:j.accountId,toAccountId:'',category:'薪資',projectId:'',
    date:payInfo(j,ym0).date,note:`${j.name} ${cur.getMonth()+1} 月薪資`,salaryKey:key};
  if(old)db.txs[db.txs.indexOf(old)]=t;else db.txs.push(t);
  save();render();toast('已記入帳本');
}
function saveTransfer(amt){
  const src=db.accounts.find(a=>a.id===(jobs().find(j=>j.kind==='main')||jobs()[0])?.accountId)||db.accounts.find(a=>a.type==='bank');
  openTx();Object.assign(draft,{type:'move',amount:amt,accountId:src?.id||draft.accountId,note:'儲蓄'});
  if(draft.toAccountId===draft.accountId)draft.toAccountId=db.accounts.find(a=>a.id!==draft.accountId)?.id;drawTx();
}
async function applyAllocBudget(){
  const al=allocCalc(ym()),v=al.rows.filter(x=>x.b.cats.length).reduce((s,x)=>s+x.amt,0);
  if(!await ask(`把每月預算設為 ${money(v)}（有對應消費類別的配置加總）？`))return;
  db.budget=v;save();render();toast('已更新每月預算');
}

function saveJob(){
  syncJob();const j=jdraft;
  j.name=j.name.trim();if(!j.name)return toast('請輸入名稱');
  if(j.pay==='hourly'?!(+j.hourly>0):!(+j.amount>0))return toast(j.pay==='hourly'?'請輸入時薪':'請輸入月薪');
  j.pension=Math.min(6,Math.max(0,+j.pension||0));j.deps=Math.min(3,Math.max(0,+j.deps||0));
  if(j.id)Object.assign(acctJob(j.id),j);else{j.id=uid();db.salary.jobs.push(j)}
  save();render();openJobList();toast('已儲存');
}
async function delJob(id){
  if(!await ask('刪除這份工作？它的獎金紀錄也會一起刪除。'))return;
  db.salary.jobs=jobs().filter(j=>j.id!==id);db.salary.bonuses=db.salary.bonuses.filter(b=>b.jobId!==id);
  save();render();openJobList();
}

function saveBonus(id){

  const d={name,jobId:$('#bj').value,amount,date};
  if(id)Object.assign(db.salary.bonuses.find(x=>x.id===id),d);else db.salary.bonuses.push({id:uid(),...d});

async function delBonus(id){if(!await ask('刪除這筆獎金？'))return;db.salary.bonuses=db.salary.bonuses.filter(b=>b.id!==id);save();closeSheet();render()}
async function recordBonus(id){
  const b=db.salary.bonuses.find(x=>x.id===id),j=acctJob(b.jobId),c=calcBonuses(b.date.slice(0,4))[id];
  if(!j.accountId||!acct(j.accountId))return toast('請先在薪資設定選好入帳帳戶');
  const old=db.txs.find(t=>t.bonusId===id);
  if(old&&!await ask('這筆獎金已經記過，要更新金額嗎？'))return;
  if(!db.categories.in.includes('獎金'))db.categories.in.push('獎金');
  const t={id:old?.id||uid(),ts:Date.now(),type:'in',amount:c.net,accountId:j.accountId,toAccountId:'',category:'獎金',projectId:'',date:b.date,note:`${j.name} ${b.name}`,bonusId:id};
  if(old)db.txs[db.txs.indexOf(old)]=t;else db.txs.push(t);
  save();closeSheet();render();toast('已記入帳本');
}

  const r=rdraft,editing=!!r.id;

    <div class="seg">${['out','in'].map(k=>`<button data-t="${k}" class="${r.type===k?'on':''}" onclick="syncRec();rdraft.type='${k}';if(!db.categories['${k}'].includes(rdraft.category))rdraft.category=db.categories['${k}'][0];drawRec()">${k==='out'?'支出':'收入'}</button>`).join('')}</div>

      <div class="f"><label>通知上的店名（選填）</label><input id="rkw" value="${esc(r.kw||'')}" placeholder="例：ANTHROPIC"></div></div>`:''}

function syncRec(){
  const g=id=>document.getElementById(id);
  if(g('rn'))rdraft.name=g('rn').value; if(g('ra'))rdraft.amount=g('ra').value;
  if(g('rac'))rdraft.accountId=g('rac').value; if(g('rc'))rdraft.category=g('rc').value;
  if(g('rp'))rdraft.projectId=g('rp').value; if(g('rf'))rdraft.freq=g('rf').value;
  if(g('rd'))rdraft.day=g('rd').value; if(g('rs'))rdraft.start=g('rs').value; if(g('re'))rdraft.end=g('re').value;
  if(g('rv'))rdraft.vary=g('rv').checked; if(g('rfee'))rdraft.feePct=parseFloat(g('rfee').value)||0; if(g('rkw'))rdraft.kw=g('rkw').value.trim();
}
async function saveRec(){
  syncRec();const r=rdraft;
  r.name=r.name.trim();r.amount=Math.round(parseFloat(r.amount)*100)/100;r.day=Math.min(31,Math.max(1,parseInt(r.day)||1));
  if(!r.name)return toast('請輸入名稱');
  if(!(r.amount>0))return toast('請輸入大於 0 的金額');
  if(!r.start)return toast('請選擇開始日');
  if(r.end&&r.end<r.start)return toast('結束日要晚於開始日');
  const td=today();
  if(!r.id){
    r.id=uid();
    const past=occurrences(r,r.start,td).length;
    if(past&&!await ask(`開始日到今天共有 ${past} 次扣款，要一併補記嗎？`,'一併補記','不用，從明天開始'))r.posted=td;
    db.recurring.push(r);
  }else{
    Object.assign(db.recurring.find(x=>x.id===r.id),r);
  }
  const n=postRecurring();save();render();openRecList();toast(n?`已儲存，並補記 ${n} 筆`:'已儲存');
}
async function delRec(id){
  if(!await ask('刪除這個週期性付款？已經記錄的紀錄會保留。'))return;
  db.recurring=db.recurring.filter(r=>r.id!==id);save();render();openRecList();toast('已刪除');
}

function editBudget(){
  openSheet(`<h2>每月預算</h2>
    <div class="amount-in"><span>$</span><input id="bg" class="num" type="number" inputmode="numeric" placeholder="0" value="${db.budget||''}"></div>
    <p class="hint">填 0 代表不使用預算。</p>
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">取消</button>
    <button class="btn" onclick="db.budget=Math.max(0,parseFloat($('#bg').value)||0);save();closeSheet();render();toast('已儲存預算')">儲存</button></div>`);
  setTimeout(()=>$('#bg').focus(),280);
}

/* ---------- 分類／專案 ---------- */
function editList(kind){
  const title={out:'支出分類',in:'收入分類',proj:'專案'}[kind];
  const items=kind==='proj'?db.projects.map(p=>p.name):db.categories[kind];
  openSheet(`<h2>${title}</h2><div>
    ${items.length?items.map((n,i)=>`<div class="li"><span class="nm">${esc(n)}</span><button class="mv" ${i?'':'disabled'} onclick="mvList('${kind}',${i},-1)">▲</button><button class="mv" ${i<items.length-1?'':'disabled'} onclick="mvList('${kind}',${i},1)">▼</button><button class="x" onclick="rmItem('${kind}',${i})">移除</button></div>`).join('')
      :`<p class="hint">還沒有專案。例如「日本旅遊」「裝潢」，記帳時就能標記。</p>`}</div>
    <div class="addrow"><input id="ni" placeholder="新增${kind==='proj'?'專案':'分類'}名稱"><button onclick="addItem('${kind}')">新增</button></div>
    <div class="acts"><button class="btn" onclick="closeSheet()">完成</button></div>`);
}
function addItem(kind){
  const n=$('#ni').value.trim();if(!n)return;
  if(kind==='proj')db.projects.push({id:uid(),name:n});
  else{if(db.categories[kind].includes(n))return toast('已有這個分類');db.categories[kind].push(n)}
  save();editList(kind);render();
}
async function rmItem(kind,i){
  if(kind==='proj'){
    if(!await ask('移除專案後，相關紀錄會變成「無專案」。確定？'))return;
    const id=db.projects[i].id;db.projects.splice(i,1);
    db.txs.forEach(t=>{if(t.projectId===id)t.projectId=''});db.recurring.forEach(r=>{if(r.projectId===id)r.projectId=''});
  }else{
    if(db.categories[kind].length<=1)return toast('至少要保留一個分類');
    db.categories[kind].splice(i,1);
  }
  save();editList(kind);render();
}

/* ================= PWA Manifest ================= */
(function(){
  const iconURL=ICON_IMG;
  const manifest={name:'存錢小豬記帳本',short_name:'記帳本',start_url:location.href,display:'standalone',
    background_color:'#FDF8F2',theme_color:'#FDF8F2',icons:[{src:iconURL,sizes:'256x256',type:'image/jpeg',purpose:'any'}]};
  const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)};
  const ownSite=/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);
  if(ownSite){
    /* 放在自己的網站（例如 GitHub Pages）：用正式的 manifest 與 service worker，可安裝成全螢幕 App、離線使用 */
    add('manifest','manifest.json');add('icon','icon-192.png');add('apple-touch-icon','icon-192.png');
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  }else{
    add('manifest',URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'})));
    add('icon',iconURL);add('apple-touch-icon',iconURL);
  }
})();
